<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studyo4 — Controle de Alterações</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{ --cream:#F5F0E8; --dark:#1A1714; --mid:#3D3830; --accent:#C8A96E;
    --red:#C0392B; --orange:#E67E22; --green:#27AE60; --blue:#2E86C1; --roxo:#8E7CC3;
    --border:#E0D8CC; --text-muted:#8A8278; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; }
  .hidden{ display:none !important; }
  header{ background:var(--dark); color:var(--cream); padding:12px 26px; display:flex; align-items:center; gap:14px; }
  .brand{ font-family:'DM Serif Display',serif; font-size:19px; }
  .brand .accent{ color:var(--accent); }
  .spacer{ flex:1; }
  .btn-voltar{ font-size:11px; font-weight:600; color:var(--cream); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:5px 12px; text-decoration:none; white-space:nowrap; }
  .btn-voltar:hover{ background:var(--accent); color:var(--dark); }
  .user-chip{ font-size:12px; font-weight:600; background:rgba(255,255,255,.1); border-radius:20px; padding:6px 14px; }
  .container{ max-width:1000px; margin:0 auto; padding:22px 26px 60px; }
  .toolbar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  select,input,textarea{ border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:'DM Sans',sans-serif; font-size:13px; color:var(--dark); background:#fff; outline:none; }
  select:focus,input:focus,textarea:focus{ border-color:var(--accent); }
  textarea{ resize:vertical; min-height:64px; width:100%; }
  .btn{ border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .btn-primary{ background:var(--dark); color:var(--cream); }
  .btn-primary:hover{ opacity:.9; }
  .btn-ghost{ background:#fff; border:1px solid var(--border); color:var(--dark); }
  .btn-ghost:hover{ border-color:var(--accent); color:var(--accent); }
  .btn-sm{ padding:6px 11px; font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; pointer-events:none; }
  .field-label{ font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; display:block; }
  .prod-bloco{ margin-bottom:22px; }
  .prod-nome{ font-family:'DM Serif Display',serif; font-size:18px; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
  .mod-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px; }
  .mod-card{ background:#fff; border:1px solid var(--border); border-radius:10px; padding:13px 15px; cursor:pointer; transition:box-shadow .15s, transform .1s; }
  .mod-card:hover{ box-shadow:0 6px 16px rgba(0,0,0,.07); transform:translateY(-1px); }
  .mod-nome{ font-weight:600; font-size:14px; margin-bottom:6px; }
  .mod-meta{ font-size:11px; color:var(--text-muted); display:flex; gap:10px; flex-wrap:wrap; }
  .pill{ font-size:9px; font-weight:700; border-radius:20px; padding:2px 8px; text-transform:uppercase; letter-spacing:.4px; white-space:nowrap; }
  .pill.validado{ background:#d5efe0; color:var(--green); }
  .pill.naoval{ background:#eee; color:var(--text-muted); }
  .pill.pendente{ background:#fae9d3; color:var(--orange); }
  .pill.em_andamento{ background:#e8eef5; color:var(--blue); }
  .pill.concluida{ background:#d5efe0; color:var(--green); }
  .overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(2px); }
  .modal{ background:#fff; border-radius:14px; width:640px; max-width:100%; max-height:92vh; overflow-y:auto; padding:24px; position:relative; }
  .modal h2{ font-family:'DM Serif Display',serif; font-size:21px; margin-bottom:3px; padding-right:26px; }
  .modal .sub{ font-size:12px; color:var(--text-muted); margin-bottom:6px; }
  .modal .close{ position:absolute; top:14px; right:16px; font-size:24px; cursor:pointer; color:var(--text-muted); }
  .section-label{ font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; display:block; border-top:1px solid var(--border); padding-top:14px; }
  .alt-item{ background:#faf7f1; border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .alt-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .alt-data{ font-size:13px; font-weight:600; }
  .alt-por{ font-size:11px; color:var(--text-muted); }
  .alt-desc{ font-size:14px; margin:8px 0; line-height:1.5; white-space:pre-wrap; word-break:break-word; }
  .alt-resp{ font-size:12px; color:var(--text-muted); }
  .anexos-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
  .anexo{ position:relative; width:78px; }
  .anexo a{ display:block; text-decoration:none; color:var(--dark); }
  .anexo .thumb{ width:78px; height:78px; border:1px solid var(--border); border-radius:8px; object-fit:cover; background:#faf7f1; display:flex; align-items:center; justify-content:center; font-size:26px; }
  img.thumb{ display:block; }
  .anexo .nome{ font-size:9px; color:var(--text-muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .anexo .del{ position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--red); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; }
  .empty{ color:var(--text-muted); font-size:13px; text-align:center; padding:26px; }
  .mods-lista{ display:flex; flex-wrap:wrap; gap:8px; }
  .mod-tag{ display:inline-flex; align-items:center; gap:6px; background:#faf7f1; border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:13px; }
  .mod-tag button{ border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:15px; line-height:1; }
  .mod-tag button:hover{ color:var(--red); }
  #toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--green); color:#fff; padding:11px 22px; border-radius:8px; font-size:13px; font-weight:600; opacity:0; transition:opacity .3s; z-index:200; }
  #toast.show{ opacity:1; }
</style>
</head>
<body>
<header>
  <a class="btn-voltar" href="index.html" title="Voltar para a tela inicial">← Início</a>
  <div class="brand">STUDYO<span class="accent">4</span></div>
  <span style="font-size:13px;color:var(--accent)">Controle de Alterações</span>
  <div class="spacer"></div>
  <span class="user-chip" id="userChip">👤</span>
  <button class="btn-voltar" id="btnMods" style="cursor:pointer" onclick="abrirModulacoes()">Modulações</button>
</header>

<div class="container">
  <div class="toolbar">
    <input id="busca" placeholder="Buscar produto..." style="flex:1;min-width:200px" oninput="renderFichas()">
    <button class="btn btn-primary" id="btnNova" onclick="abrirNovaFicha()">+ Nova ficha</button>
  </div>
  <div id="listaFichas"><div class="empty">Carregando...</div></div>
</div>

<!-- MODAL FICHA (detalhe) -->
<div class="overlay" id="ovFicha">
  <div class="modal">
    <span class="close" onclick="fechar('ovFicha')">&times;</span>
    <h2 id="fdTitulo">Produto</h2>
    <div class="sub" id="fdSub">—</div>

    <span class="section-label">Validação do protótipo</span>
    <div style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
      <div><label class="field-label">Protótipo validado em</label><input type="date" id="fdValidacao"></div>
      <button class="btn btn-ghost btn-sm" id="fdSalvarVal" onclick="salvarValidacao()">Salvar validação</button>
      <button class="btn btn-ghost btn-sm" id="fdAnexoVal" onclick="document.getElementById('inpAnexoVal').click()">📎 Foto da validação</button>
      <input type="file" id="inpAnexoVal" accept="image/*,application/pdf" multiple class="hidden" onchange="enviarAnexosVal(event)">
    </div>
    <div class="anexos-grid" id="fdAnexosVal" style="margin-top:10px"></div>

    <span class="section-label">Linha do tempo de alterações</span>
    <div id="fdAlteracoes"><div class="empty">—</div></div>

    <div id="fdFormAlt" style="border-top:1px solid var(--border);margin-top:14px;padding-top:14px">
      <label class="field-label">Registrar alteração</label>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px">
        <div><label class="field-label">Data</label><input type="date" id="altData" class="full"></div>
        <div><label class="field-label">Solicitante (Por)</label><input id="altSolic" class="full" placeholder="quem pediu"></div>
        <div><label class="field-label">Responsável (Dev)</label><input id="altResp" class="full"></div>
        <div><label class="field-label">Status</label>
          <select id="altStatus" class="full"><option value="pendente">Pendente</option><option value="em_andamento">Em andamento</option><option value="concluida">Concluída</option></select>
        </div>
      </div>
      <label class="field-label">O que foi alterado</label>
      <textarea id="altDesc" placeholder="descreva a alteração"></textarea>
      <div id="altPendAnexos" style="margin:8px 0;font-size:12px;color:var(--text-muted)"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('inpAltAnexo').click()">📎 Anexar</button>
        <input type="file" id="inpAltAnexo" accept="image/*,application/pdf" multiple class="hidden" onchange="filaAltAnexo(event)">
        <button class="btn btn-primary btn-sm" id="btnSalvarAlt" onclick="salvarAlteracao()">Registrar alteração</button>
      </div>
    </div>
  </div>
</div>

<!-- MODAL NOVA FICHA -->
<div class="overlay" id="ovNova">
  <div class="modal" style="width:480px">
    <span class="close" onclick="fechar('ovNova')">&times;</span>
    <h2>Nova ficha</h2>
    <div class="sub">Produto + modulação. A modulação vem da lista padronizada.</div>
    <div style="margin-top:12px"><label class="field-label">Produto</label><input id="nfProduto" class="full" placeholder="ex.: Estofado Notte"></div>
    <div style="margin-top:10px"><label class="field-label">Modulação</label><select id="nfModulacao" class="full"></select></div>
    <div style="margin-top:10px"><label class="field-label">Protótipo validado em (opcional)</label><input type="date" id="nfValidacao" class="full"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px">
      <button class="btn btn-ghost" onclick="fechar('ovNova')">Cancelar</button>
      <button class="btn btn-primary" id="btnSalvarFicha" onclick="salvarFicha()">Criar ficha</button>
    </div>
  </div>
</div>

<!-- MODAL MODULAÇÕES (admin) -->
<div class="overlay" id="ovMods">
  <div class="modal" style="width:460px">
    <span class="close" onclick="fechar('ovMods')">&times;</span>
    <h2>Modulações</h2>
    <div class="sub">Nomenclaturas padronizadas usadas nas fichas.</div>
    <div style="display:flex;gap:8px;margin:14px 0">
      <input id="modNova" class="full" placeholder="nova modulação" onkeydown="if(event.key==='Enter')addModulacao()">
      <button class="btn btn-primary btn-sm" onclick="addModulacao()">+ Add</button>
    </div>
    <div class="mods-lista" id="modsLista"></div>
  </div>
</div>

<div id="toast">Salvo!</div>

<script>
const SUPABASE_URL = 'https://luocdqquuvgxcpyklmwu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b2NkcXF1dXZneGNweWtsbXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA5NjYsImV4cCI6MjEwNDQ1Njk2Nn0.snOTfxctxig8sKlOUfan19DuMSa2Q56vA5gWdwo4H3A';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const SESSAO_KEY = 'studyo4_sessao';
const BUCKET = 'anexos';
const ST_LABEL = { pendente:'Pendente', em_andamento:'Em andamento', concluida:'Concluída' };

let sessao = null, podeEditar = false, fichas = [], modulacoes = [];
let fichaAtual = null, altAnexosFila = [];

function nivelArea(area){
  if (sessao && sessao.admin) return 'edicao';
  const p = sessao && sessao.permissoes;
  if (p && Object.keys(p).length) return p[area] || 'nenhum';
  return 'nenhum';
}
function fechar(id){ document.getElementById(id).style.display='none'; }
function abrir(id){ document.getElementById(id).style.display='flex'; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const abertas = [...document.querySelectorAll('.overlay')].filter(o => o.style.display === 'flex');
    if (abertas.length) abertas[abertas.length - 1].style.display = 'none';
  }
});
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg||'Salvo!'; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1800); }
function hojeISO(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fmt(d){ if(!d) return '—'; const [a,m,dia]=d.split('-'); return `${dia}/${m}/${a}`; }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function bytes(n){ if(!n) return ''; const u=['B','KB','MB']; let v=n,i=0; while(v>=1024&&i<u.length-1){v/=1024;i++;} return v.toFixed(v<10&&i>0?1:0)+' '+u[i]; }

// Compressão de imagem no navegador (mesmo padrão do checklist)
function comprimirImagem(file){
  return new Promise(resolve=>{
    if(!file.type.startsWith('image/')){ resolve(file); return; }
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{ URL.revokeObjectURL(url); let w=img.width,h=img.height;
      if(w>1600||h>1600){ if(w>=h){h=Math.round(h*1600/w);w=1600;} else {w=Math.round(w*1600/h);h=1600;} }
      const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h);
      c.toBlob(b=>resolve(b||file),'image/jpeg',0.7); };
    img.onerror=()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src=url;
  });
}
async function subirAnexo(fichaId, alteracaoId, file){
  const blob=await comprimirImagem(file);
  const ehImg=file.type.startsWith('image/');
  const base=file.name.replace(/\.[^.]+$/,'');
  const ext=ehImg?'jpg':(file.name.split('.').pop()||'bin');
  const safe=(base.replace(/[^a-zA-Z0-9-_]+/g,'_').slice(0,40))||'arquivo';
  const path=`alteracoes/${fichaId}/${Date.now()}_${safe}.${ext}`;
  const tipo=ehImg?'image/jpeg':(file.type||'application/octet-stream');
  const up=await sb.storage.from(BUCKET).upload(path, blob, { contentType:tipo, upsert:false });
  if(up.error) throw up.error;
  const { data:pub }=sb.storage.from(BUCKET).getPublicUrl(path);
  const ins=await sb.from('alt_anexos').insert({ ficha_id:fichaId, alteracao_id:alteracaoId||null, url:pub.publicUrl, caminho:path, nome:file.name, tipo, tamanho:blob.size, enviado_por:sessao.nome });
  if(ins.error) throw ins.error;
}

/* ── SESSÃO / CARGA ── */
function carregarSessao(){
  try{ sessao=JSON.parse(localStorage.getItem(SESSAO_KEY)||'null'); }catch(e){ sessao=null; }
  if(!sessao||!sessao.id){ location.href='index.html'; return false; }
  const nv=nivelArea('alteracoes');
  if(nv==='nenhum'){ location.href='index.html'; return false; }
  podeEditar=(nv==='edicao');
  document.getElementById('userChip').textContent='👤 '+sessao.nome;
  if(!podeEditar){ document.getElementById('btnNova').style.display='none'; document.getElementById('btnMods').style.display='none'; }
  return true;
}

async function carregarModulacoes(){
  const { data }=await sb.from('modulacoes').select('*').eq('ativo',true).order('nome');
  modulacoes=data||[];
  document.getElementById('nfModulacao').innerHTML=modulacoes.map(m=>`<option>${esc(m.nome)}</option>`).join('');
}

async function carregarFichas(){
  const { data, error }=await sb.from('alt_fichas').select('*').order('produto').order('modulacao');
  if(error){ document.getElementById('listaFichas').innerHTML='<div class="empty">Erro ao carregar. Rodou o SQL do módulo?</div>'; return; }
  fichas=data||[];
  const { data:alts }=await sb.from('alt_alteracoes').select('ficha_id,status');
  const cont={};
  (alts||[]).forEach(a=>{ (cont[a.ficha_id]=cont[a.ficha_id]||{n:0,aberto:0}); cont[a.ficha_id].n++; if(a.status!=='concluida') cont[a.ficha_id].aberto++; });
  fichas.forEach(f=>{ f._alt=cont[f.id]||{n:0,aberto:0}; });
  renderFichas();
}

function renderFichas(){
  const q=(document.getElementById('busca').value||'').trim().toLowerCase();
  const alvo=fichas.filter(f=>!q || (f.produto||'').toLowerCase().includes(q) || (f.modulacao||'').toLowerCase().includes(q));
  const el=document.getElementById('listaFichas');
  if(!alvo.length){ el.innerHTML='<div class="empty">Nenhuma ficha ainda. Clique em “+ Nova ficha”.</div>'; return; }
  const grupos={};
  alvo.forEach(f=>{ (grupos[f.produto]=grupos[f.produto]||[]).push(f); });
  el.innerHTML=Object.keys(grupos).map(prod=>{
    const cards=grupos[prod].map(f=>{
      const val=f.data_validacao?`<span class="pill validado">✓ Validado</span>`:`<span class="pill naoval">Não validado</span>`;
      const alt=f._alt.n?`${f._alt.n} alteração(ões)${f._alt.aberto?` · <b style="color:var(--orange)">${f._alt.aberto} aberta(s)</b>`:''}`:'sem alterações';
      return `<div class="mod-card" onclick="abrirFicha('${f.id}')">
        <div class="mod-nome">${esc(f.modulacao)}</div>
        <div class="mod-meta">${val}</div>
        <div class="mod-meta" style="margin-top:6px">${alt}</div>
      </div>`;
    }).join('');
    return `<div class="prod-bloco"><div class="prod-nome">${esc(prod)}</div><div class="mod-grid">${cards}</div></div>`;
  }).join('');
}

/* ── DETALHE DA FICHA ── */
async function abrirFicha(id){
  fichaAtual=fichas.find(f=>f.id===id); if(!fichaAtual) return;
  altAnexosFila=[];
  document.getElementById('fdTitulo').textContent=fichaAtual.produto;
  document.getElementById('fdSub').textContent='Modulação: '+fichaAtual.modulacao;
  document.getElementById('fdValidacao').value=fichaAtual.data_validacao||'';
  document.getElementById('fdValidacao').disabled=!podeEditar;
  ['fdSalvarVal','fdAnexoVal','fdFormAlt'].forEach(i=>document.getElementById(i).style.display=podeEditar?'':'none');
  document.getElementById('altData').value=hojeISO();
  document.getElementById('altSolic').value='';
  document.getElementById('altResp').value=sessao.nome;
  document.getElementById('altStatus').value='pendente';
  document.getElementById('altDesc').value='';
  document.getElementById('altPendAnexos').textContent='';
  abrir('ovFicha');
  await Promise.all([carregarAnexosVal(), carregarAlteracoes()]);
}

async function carregarAnexosVal(){
  const { data }=await sb.from('alt_anexos').select('*').eq('ficha_id',fichaAtual.id).is('alteracao_id',null).order('created_at',{ascending:false});
  document.getElementById('fdAnexosVal').innerHTML=renderAnexos(data||[]);
}
async function carregarAlteracoes(){
  const el=document.getElementById('fdAlteracoes');
  const { data:alts }=await sb.from('alt_alteracoes').select('*').eq('ficha_id',fichaAtual.id).order('created_at',{ascending:false});
  if(!alts||!alts.length){ el.innerHTML='<div class="empty">Nenhuma alteração registrada.</div>'; return; }
  const { data:anx }=await sb.from('alt_anexos').select('*').eq('ficha_id',fichaAtual.id).not('alteracao_id','is',null).order('created_at',{ascending:false});
  const porAlt={}; (anx||[]).forEach(a=>{ (porAlt[a.alteracao_id]=porAlt[a.alteracao_id]||[]).push(a); });
  el.innerHTML=alts.map(a=>{
    const statusSel=podeEditar
      ? `<select onchange="mudarStatus('${a.id}',this.value)" style="font-size:11px;padding:3px 6px">${Object.keys(ST_LABEL).map(s=>`<option value="${s}"${a.status===s?' selected':''}>${ST_LABEL[s]}</option>`).join('')}</select>`
      : `<span class="pill ${a.status}">${ST_LABEL[a.status]}</span>`;
    return `<div class="alt-item">
      <div class="alt-top">
        <span class="alt-data">📅 ${fmt(a.data)}</span>
        ${statusSel}
      </div>
      <div class="alt-por">Por: ${esc(a.solicitante||'—')}</div>
      <div class="alt-desc">${esc(a.descricao)}</div>
      <div class="alt-resp">👤 Responsável: ${esc(a.responsavel||'—')}</div>
      <div class="anexos-grid">${renderAnexos(porAlt[a.id]||[])}</div>
    </div>`;
  }).join('');
}
function renderAnexos(list){
  if(!list.length) return '';
  return list.map(a=>{
    const ehImg=(a.tipo||'').startsWith('image/');
    const thumb=ehImg?`<img class="thumb" src="${a.url}">`:`<span class="thumb">📄</span>`;
    const del=podeEditar?`<button class="del" title="Excluir" onclick="event.preventDefault();excluirAnexo('${a.id}','${a.caminho}')">&times;</button>`:'';
    return `<div class="anexo"><a href="${a.url}" target="_blank" rel="noopener">${thumb}<div class="nome">${esc(a.nome||'arquivo')}</div></a>${del}</div>`;
  }).join('');
}

async function salvarValidacao(){
  if(!podeEditar||!fichaAtual) return;
  const v=document.getElementById('fdValidacao').value||null;
  const { error }=await sb.from('alt_fichas').update({ data_validacao:v, updated_at:new Date().toISOString() }).eq('id',fichaAtual.id);
  if(error){ alert('Erro: '+error.message); return; }
  fichaAtual.data_validacao=v; const f=fichas.find(x=>x.id===fichaAtual.id); if(f) f.data_validacao=v;
  toast('Validação salva'); renderFichas();
}
async function enviarAnexosVal(ev){
  const files=Array.from(ev.target.files||[]); ev.target.value=''; if(!files.length) return;
  const btn=document.getElementById('fdAnexoVal'); btn.disabled=true; const orig=btn.textContent;
  for(const f of files){ btn.textContent='Enviando...'; try{ await subirAnexo(fichaAtual.id,null,f); }catch(e){ alert('Erro no anexo '+f.name+': '+e.message); } }
  btn.textContent=orig; btn.disabled=false; carregarAnexosVal();
}

function filaAltAnexo(ev){
  const files=Array.from(ev.target.files||[]); ev.target.value=''; altAnexosFila.push(...files);
  document.getElementById('altPendAnexos').textContent=altAnexosFila.length?`${altAnexosFila.length} anexo(s) na fila: `+altAnexosFila.map(f=>f.name).join(', '):'';
}
async function salvarAlteracao(){
  if(!podeEditar||!fichaAtual) return;
  const desc=document.getElementById('altDesc').value.trim();
  if(!desc){ alert('Descreva a alteração.'); return; }
  const btn=document.getElementById('btnSalvarAlt'); btn.disabled=true;
  const dados={ ficha_id:fichaAtual.id, data:document.getElementById('altData').value||hojeISO(),
    solicitante:document.getElementById('altSolic').value.trim()||null, descricao:desc,
    responsavel:document.getElementById('altResp').value.trim()||null, status:document.getElementById('altStatus').value, criado_por:sessao.id };
  try{
    const { data:nova, error }=await sb.from('alt_alteracoes').insert(dados).select().single();
    if(error) throw error;
    for(const f of altAnexosFila){ btn.textContent='Enviando anexos...'; try{ await subirAnexo(fichaAtual.id,nova.id,f); }catch(e){ alert('Erro no anexo '+f.name+': '+e.message); } }
    altAnexosFila=[]; document.getElementById('altPendAnexos').textContent='';
    document.getElementById('altDesc').value=''; document.getElementById('altSolic').value='';
    document.getElementById('altStatus').value='pendente';
    toast('Alteração registrada');
    await carregarAlteracoes(); await carregarFichas();
  }catch(e){ alert('Erro: '+e.message); }
  finally{ btn.disabled=false; btn.textContent='Registrar alteração'; }
}
async function mudarStatus(id,valor){
  const { error }=await sb.from('alt_alteracoes').update({ status:valor }).eq('id',id);
  if(error){ alert('Erro: '+error.message); return; }
  toast('Status atualizado'); carregarFichas();
}
async function excluirAnexo(id,caminho){
  if(!confirm('Excluir este anexo?')) return;
  try{ await sb.storage.from(BUCKET).remove([caminho]); await sb.from('alt_anexos').delete().eq('id',id);
    carregarAnexosVal(); carregarAlteracoes(); }catch(e){ alert('Erro: '+e.message); }
}

/* ── NOVA FICHA ── */
function abrirNovaFicha(){
  if(!podeEditar) return;
  document.getElementById('nfProduto').value='';
  document.getElementById('nfValidacao').value='';
  if(modulacoes.length) document.getElementById('nfModulacao').value=modulacoes[0].nome;
  abrir('ovNova'); document.getElementById('nfProduto').focus();
}
async function salvarFicha(){
  if(!podeEditar) return;
  const produto=document.getElementById('nfProduto').value.trim();
  const modulacao=document.getElementById('nfModulacao').value;
  if(!produto){ alert('Informe o produto.'); return; }
  if(!modulacao){ alert('Selecione a modulação.'); return; }
  const btn=document.getElementById('btnSalvarFicha'); btn.disabled=true;
  try{
    const { error }=await sb.from('alt_fichas').insert({ produto, modulacao, data_validacao:document.getElementById('nfValidacao').value||null, criado_por:sessao.id });
    if(error) throw error;
    fechar('ovNova'); toast('Ficha criada'); await carregarFichas();
  }catch(e){ alert('Erro: '+e.message); }
  finally{ btn.disabled=false; }
}

/* ── MODULAÇÕES (admin) ── */
function abrirModulacoes(){ if(!podeEditar) return; renderMods(); abrir('ovMods'); }
function renderMods(){
  document.getElementById('modsLista').innerHTML=modulacoes.map(m=>`<span class="mod-tag">${esc(m.nome)} <button title="Remover" onclick="delModulacao('${m.id}')">&times;</button></span>`).join('')||'<span style="font-size:12px;color:var(--text-muted)">Nenhuma.</span>';
}
async function addModulacao(){
  const inp=document.getElementById('modNova'); const nome=inp.value.trim();
  if(!nome) return;
  const { error }=await sb.from('modulacoes').insert({ nome });
  if(error){ alert(error.message.includes('duplicate')?'Essa modulação já existe.':'Erro: '+error.message); return; }
  inp.value=''; await carregarModulacoes(); renderMods();
}
async function delModulacao(id){
  if(!confirm('Remover esta modulação da lista? (fichas já criadas não mudam)')) return;
  const { error }=await sb.from('modulacoes').delete().eq('id',id);
  if(error){ alert('Erro: '+error.message); return; }
  await carregarModulacoes(); renderMods();
}

/* ── BOOT ── */
(async function(){
  if(!sb){ document.getElementById('listaFichas').innerHTML='<div class="empty">Supabase indisponível.</div>'; return; }
  if(!carregarSessao()) return;
  await carregarModulacoes();
  await carregarFichas();
})();
</script>
</body>
