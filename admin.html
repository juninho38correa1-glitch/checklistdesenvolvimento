<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studyo4 — Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream: #F5F0E8;
    --dark: #1A1714;
    --mid: #3D3830;
    --accent: #C8A96E;
    --red: #C0392B;
    --red-soft: #F5D5D2;
    --orange: #E67E22;
    --orange-soft: #FAE9D3;
    --green: #27AE60;
    --green-soft: #D5EFE0;
    --border: #E0D8CC;
    --text-muted: #8A8278;
    --blue: #3498db;
    --blue-soft: #D6EAF8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--dark); display: flex; flex-direction: column; }

  /* HEADER */
  header {
    background: var(--dark); padding: 8px 30px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--accent); flex-shrink: 0;
  }
  .logo-area { display: flex; align-items: center; gap: 16px; }
  .logo-text { font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 300; color: var(--cream); letter-spacing: 3px; text-transform: uppercase; }
  .logo-sub { font-size: 8px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; margin-top: 1px; }
  .admin-badge { background: var(--accent); color: var(--dark); font-size: 9px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; }
  .back-link { font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 600; color: var(--cream); background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.15); border-radius: 20px; padding: 5px 12px; text-decoration: none; white-space: nowrap; transition: all .15s; }
  .back-link:hover { background: var(--accent); color: var(--dark); border-color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .header-date { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .refresh-btn { background: none; border: 1px solid rgba(255,255,255,0.15); color: var(--cream); padding: 4px 12px; border-radius: 4px; font-size: 11px; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .refresh-btn:hover { background: rgba(255,255,255,0.08); }

  /* STATS BAR */
  .stats-bar {
    display: flex; gap: 0; background: white;
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .stat-card {
    flex: 1; padding: 12px 20px; border-right: 1px solid var(--border);
    text-align: center; transition: background 0.15s;
  }
  .stat-card:last-child { border-right: none; }
  .stat-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 4px; display: flex; align-items: center; justify-content: center; gap: 5px; }
  .stat-num { font-family: 'DM Serif Display', serif; font-size: 26px; color: var(--dark); line-height: 1; }
  .sdot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  /* Lead time de resposta (aba Solicitações) */
  .lt-bar { display: flex; flex-wrap: wrap; background: white; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; }
  .lt-card { flex: 1 1 170px; padding: 11px 14px; border-right: 1px solid var(--border); text-align: center; }
  .lt-card:last-child { border-right: none; }
  .lt-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 5px; }
  .lt-num { font-family: 'DM Serif Display', serif; font-size: 22px; color: var(--dark); line-height: 1; }
  .lt-sub { font-size: 10px; color: var(--text-muted); margin-top: 4px; line-height: 1.3; }

  /* FILTER BAR */
  .filter-bar {
    display: flex; align-items: center; gap: 10px; padding: 10px 24px;
    background: var(--cream); border-bottom: 1px solid var(--border);
    flex-shrink: 0; flex-wrap: wrap;
  }
  .filter-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .filter-pills { display: flex; gap: 6px; }
  .pill {
    padding: 4px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: white; color: var(--text-muted);
    transition: all 0.15s; white-space: nowrap;
  }
  .pill.active { background: var(--dark); color: var(--cream); border-color: var(--dark); }
  .filter-sep { width: 1px; height: 22px; background: var(--border); }
  select.filter-sel {
    padding: 4px 12px; border-radius: 6px; border: 1px solid var(--border);
    font-family: 'DM Sans', sans-serif; font-size: 12px; background: white; color: var(--dark);
    outline: none; cursor: pointer;
  }
  .last-upd { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); margin-left: auto; }

  /* MAIN LAYOUT */
  .scroll-body { flex: 1 1 0; overflow-y: auto; overflow-x: hidden; }
  .main-grid { display: grid; grid-template-columns: 360px 1fr; gap: 0; min-height: 100%; }

  /* LEFT: USUÁRIOS */
  /* A lista de pessoas fica presa no topo: quem desce o feed atrás de uma
     atividade não precisa voltar tudo pra cima pra clicar numa pessoa. */
  .left-panel { border-right: 1px solid var(--border); padding: 20px; background: white;
                position: sticky; top: 0; align-self: start;
                max-height: calc(100vh - 118px); overflow-y: auto; }
  .panel-title { font-family: 'DM Serif Display', serif; font-size: 16px; margin-bottom: 14px; color: var(--dark); }
  .user-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px;
    margin-bottom: 10px; cursor: pointer; transition: all 0.15s; background: white;
  }
  .user-card:hover { border-color: var(--accent); background: #fdfaf5; }
  .user-card.active { border-color: var(--accent); background: #fdfaf5; box-shadow: 0 0 0 2px rgba(200,169,110,0.2); }
  .user-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .user-avatar {
    width: 36px; height: 36px; border-radius: 50%; background: var(--dark);
    color: var(--accent); display: flex; align-items: center; justify-content: center;
    font-family: 'DM Serif Display', serif; font-size: 15px; flex-shrink: 0;
  }
  .user-name { font-weight: 600; font-size: 14px; color: var(--dark); }
  .user-last { font-size: 11px; color: var(--text-muted); }
  .user-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .user-tag { font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600; }
  .tag-blue   { background: var(--blue-soft); color: #1a6fa8; }
  .tag-green  { background: var(--green-soft); color: #1a6e40; }
  .tag-accent { background: #f5ecd8; color: #8a6930; }
  .tag-gray   { background: #f0ece4; color: #888; }
  .user-bar { height: 4px; border-radius: 2px; background: #eee; margin-top: 10px; overflow: hidden; }
  .user-bar-fill { height: 100%; border-radius: 2px; background: var(--accent); }
  .no-name-card { border: 1px dashed var(--border); border-radius: 8px; padding: 14px 16px; margin-bottom: 10px; background: #fafafa; }
  .no-name-label { font-size: 11px; color: var(--text-muted); font-style: italic; }

  /* RIGHT: FEED */
  .right-panel { padding: 20px; }
  .feed-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .feed-count { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  .feed-item {
    display: flex; gap: 12px; padding: 10px 14px;
    border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px;
    background: white; transition: border-color 0.15s;
  }
  .feed-item:hover { border-color: #c8b898; }
  .feed-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; margin-top: 5px; }
  .fd-on    { background: var(--green); }
  .fd-off   { background: #ccc; border: 1px solid #bbb; }
  .fd-obs   { background: var(--accent); }
  .feed-body { flex: 1; min-width: 0; }
  .feed-action { font-size: 13px; color: var(--dark); line-height: 1.4; }
  .feed-action strong { color: var(--dark); }
  .feed-action .stage-name { font-weight: 600; color: var(--blue); }
  .feed-action .product-name { font-style: italic; color: var(--mid); }
  .feed-meta { display: flex; gap: 10px; margin-top: 4px; align-items: center; flex-wrap: wrap; }
  .feed-user { font-size: 11px; font-weight: 600; color: var(--accent); }
  .feed-time { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); }
  .feed-tipo { font-size: 10px; padding: 1px 7px; border-radius: 20px; font-weight: 600; }

  /* ── FILTRO DE ETAPAS ────────────────────────────────────────── */
  .stage-filter-bar {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;
    padding: 10px 14px; background: white; border: 1px solid var(--border);
    border-radius: 8px; align-items: center;
  }
  .stage-filter-label {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--text-muted); margin-right: 4px; white-space: nowrap;
  }
  .stage-pill {
    padding: 3px 11px; border-radius: 20px; font-size: 11px; font-weight: 600;
    cursor: pointer; border: 1px solid var(--border); background: #f5f0e8;
    color: var(--text-muted); transition: all 0.15s; white-space: nowrap; user-select: none;
  }
  .stage-pill:hover { border-color: var(--accent); color: var(--dark); }
  .stage-pill.active { background: var(--dark); color: var(--cream); border-color: var(--dark); }
  .stage-pill.active:hover { opacity: 0.85; }
  .stage-filter-clear {
    font-size: 10px; color: var(--accent); cursor: pointer; font-weight: 600;
    margin-left: auto; white-space: nowrap; padding: 3px 8px;
    border: 1px solid var(--accent); border-radius: 20px; background: none;
  }
  .stage-filter-clear:hover { background: var(--accent); color: var(--dark); }
  .tipo-etapa { background: var(--blue-soft); color: #1a6fa8; }
  .tipo-obs   { background: #f5ecd8; color: #8a6930; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 36px; margin-bottom: 10px; }
  .empty-text { font-size: 13px; }

  .loader { display: inline-block; width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }


  /* ── ABAS ────────────────────────────────────────────────────── */
  .tab-bar {
    display: flex; gap: 0; background: white;
    border-bottom: 2px solid var(--border); flex-shrink: 0;
    padding: 0 24px;
  }
  .tab-btn {
    padding: 10px 20px; font-size: 12px; font-weight: 600; cursor: pointer;
    border: none; background: none; color: var(--text-muted);
    border-bottom: 2px solid transparent; margin-bottom: -2px;
    transition: all 0.15s; display: flex; align-items: center; gap: 6px;
    font-family: 'DM Sans', sans-serif;
  }
  .tab-btn:hover { color: var(--dark); }
  .tab-btn.active { color: var(--dark); border-bottom-color: var(--accent); }
  .tab-content { display: none; }
  .tab-content.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  /* ── ARQUIVOS CAD ─────────────────────────────────────────────── */
  .cad-grid { display: grid; grid-template-columns: 320px 1fr; gap: 0; flex: 1; min-height: 0; overflow: hidden; }
  .cad-left  { border-right: 1px solid var(--border); padding: 20px; background: white; overflow-y: auto; }
  .cad-right { padding: 20px; overflow-y: auto; }

  .ext-badge {
    font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px; text-transform: uppercase;
    background: #f0ece4; color: var(--mid); border: 1px solid var(--border);
  }
  .ext-dwg  { background: #1a3a5c; color: white; border-color: #1a3a5c; }
  .ext-dxf  { background: #2c5a8c; color: white; border-color: #2c5a8c; }
  .ext-stp, .ext-step { background: #2e7d32; color: white; border-color: #2e7d32; }
  .ext-stl  { background: #6a1b9a; color: white; border-color: #6a1b9a; }
  .ext-pdf  { background: #c62828; color: white; border-color: #c62828; }

  .evt-badge {
    font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .evt-modificado { background: var(--blue-soft);   color: #1a6fa8; }
  .evt-criado     { background: var(--green-soft);   color: #1a6e40; }
  .evt-excluido   { background: var(--red-soft);     color: var(--red); }
  .evt-renomeado  { background: var(--orange-soft);  color: #8a4000; }

  .pc-card {
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px;
    margin-bottom: 8px; cursor: pointer; transition: all 0.15s; background: white;
  }
  .pc-card:hover  { border-color: var(--accent); }
  .pc-card.active { border-color: var(--accent); background: #fdfaf5; box-shadow: 0 0 0 2px rgba(200,169,110,0.2); }
  .pc-card-top  { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .pc-avatar    { width: 32px; height: 32px; border-radius: 6px; background: #1a3a5c; color: white; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .pc-name      { font-weight: 700; font-size: 13px; color: var(--dark); font-family: 'DM Mono', monospace; }
  .pc-sub       { font-size: 11px; color: var(--text-muted); }
  .pc-meta      { display: flex; gap: 6px; flex-wrap: wrap; }

  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: #f0ece4; }
  ::-webkit-scrollbar-thumb { background: #c8b898; border-radius: 3px; }

  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    /* Numa coluna só, prender a lista comeria a tela inteira. */
    .left-panel { border-right: none; border-bottom: 1px solid var(--border);
                  position: static; max-height: none; overflow: visible; }
  }

  /* MODAL DETALHE DA SOLICITAÇÃO */
  .sd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px; backdrop-filter: blur(2px); }
  .sd-overlay.open { display: flex; }
  .sd-modal { background: white; border-radius: 14px; width: 620px; max-width: 100%; max-height: 88vh; overflow-y: auto; padding: 24px; position: relative; }
  .sd-close { position: absolute; top: 14px; right: 16px; font-size: 24px; cursor: pointer; color: var(--text-muted); }
  .sd-title { font-family: 'DM Serif Display', serif; font-size: 21px; color: var(--dark); padding-right: 26px; line-height: 1.2; }
  .sd-sub { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .sd-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--text-muted); margin-top: 10px; }
  .sd-pill { font-size: 10px; font-weight: 700; border-radius: 20px; padding: 2px 9px; text-transform: uppercase; letter-spacing: .4px; }
  .sd-pill.aberta { background: #e8eef5; color: #2E86C1; }
  .sd-pill.em_andamento { background: #fae9d3; color: var(--orange); }
  .sd-pill.concluida { background: #d5efe0; color: #1a6e40; }
  .sd-pill.cancelada { background: #eee; color: var(--text-muted); }
  .sd-label { font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; border-top: 1px solid var(--border); padding-top: 14px; margin: 16px 0 8px; }
  .sd-desc { font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .sd-tl { display: flex; gap: 10px; padding: 9px 2px; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .sd-tl .ic { width: 22px; text-align: center; flex-shrink: 0; }
  .sd-tl .txt { white-space: pre-wrap; word-break: break-word; }
  .sd-tl .m { font-size: 10px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 2px; }
  .sd-anexos { display: flex; flex-wrap: wrap; gap: 8px; }
  .sd-anexo { width: 76px; }
  .sd-anexo a { text-decoration: none; color: var(--dark); }
  .sd-anexo .th { width: 76px; height: 76px; border: 1px solid var(--border); border-radius: 8px; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 26px; background: #faf7f1; }
  .sd-anexo .nm { font-size: 9px; color: var(--text-muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sd-anexo .bx { display: block; text-align: center; font-size: 9px; color: var(--text-muted);
                  text-decoration: none; border: 1px solid var(--border); border-radius: 5px;
                  padding: 2px 0; margin-top: 3px; background: #fff; }
  .sd-anexo .bx:hover { color: var(--dark); border-color: var(--accent); }
  .sd-empty { color: var(--text-muted); font-size: 13px; text-align: center; padding: 16px; }
  .sd-foot { display: flex; justify-content: flex-end; margin-top: 18px; border-top: 1px solid var(--border); padding-top: 14px; }

  /* ── CAIXA ALTA NA ABA SOLICITAÇÕES ──────────────────────────────
     Cada um escreve de um jeito — tudo minúsculo, tudo maiúsculo, misturado —
     e a lista fica visualmente suja. Isto é só aparência: no banco o texto
     continua exatamente como a pessoa digitou. */
  #solPessoas, #solFeedList,
  #sdTitulo, #sdSub, #sdMeta, #sdDescricaoWrap, #sdTimeline { text-transform: uppercase; }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <a class="back-link" href="index.html" title="Voltar para a tela inicial">← Início</a>
    <div>
      <div class="logo-text">STUDYO 4 ESTOFADOS</div>
      <div class="logo-sub">Conforto Design</div>
    </div>
    <div class="admin-badge">Admin</div>
  </div>
  <div class="header-right">
    <div class="header-date" id="headerDate"></div>
    <button class="refresh-btn" onclick="loadAll()">↺ Atualizar</button>
  </div>
</header>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-label"><span class="sdot" style="background:#888"></span>Total de Ações</div>
    <div class="stat-num" id="cntTotal">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label"><span class="sdot" style="background:var(--blue)"></span>Usuários Ativos</div>
    <div class="stat-num" id="cntUsers">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label"><span class="sdot" style="background:var(--green)"></span>Etapas Concluídas</div>
    <div class="stat-num" id="cntDone">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label"><span class="sdot" style="background:var(--accent)"></span>Observações</div>
    <div class="stat-num" id="cntObs">—</div>
  </div>
  <div class="stat-card">
    <div class="stat-label"><span class="sdot" style="background:var(--orange)"></span>Ações Hoje</div>
    <div class="stat-num" id="cntHoje">—</div>
  </div>
</div>

<div class="filter-bar" id="barraFiltros">
  <span class="filter-label">Período</span>
  <div class="filter-pills">
    <div class="pill active" data-range="1" onclick="setRange(1,this)">Hoje</div>
    <div class="pill" data-range="7" onclick="setRange(7,this)">7 dias</div>
    <div class="pill" data-range="30" onclick="setRange(30,this)">30 dias</div>
    <div class="pill" data-range="0" onclick="setRange(0,this)">Tudo</div>
    <!-- Os atalhos acima só sabem contar "para trás a partir de hoje". Para
         olhar um dia que já passou — o que aconteceu na segunda, por exemplo —
         não havia caminho nenhum. Este campo fecha as duas pontas no mesmo
         dia; escolher um dia desliga os atalhos, e limpar o campo devolve. -->
    <input type="date" id="filtroDia" class="filter-sel" onchange="setDia(this.value)"
           title="Mostra só o que aconteceu neste dia. Limpar o campo volta para os atalhos."
           style="padding:5px 8px">
  </div>
  <div class="filter-sep"></div>
  <span class="filter-label">Usuário</span>
  <select class="filter-sel" id="filterUser" onchange="renderFeed()">
    <option value="">Todos</option>
  </select>
  <div class="filter-sep"></div>
  <span class="filter-label">Tipo</span>
  <select class="filter-sel" id="filterTipo" onchange="renderFeed()">
    <option value="">Todos</option>
    <option value="etapa">Etapas</option>
    <option value="obs">Observações</option>
  </select>
  <span class="last-upd" id="lastUpd">Carregando...</span>
</div>

<!-- BARRA DE ABAS -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('etapas',this)">
    📋 Etapas e Ações
  </button>
  <button class="tab-btn" onclick="switchTab('solic',this)">
    📨 Solicitações
  </button>
</div>

<div class="scroll-body">

<!-- ABA: ETAPAS -->
<div id="tab-etapas" class="tab-content active">
  <div class="main-grid">
    <div class="left-panel">
      <div class="panel-title">Atividade por Pessoa</div>
      <div id="userList"><div style="text-align:center;padding:30px"><div class="loader"></div></div></div>
    </div>

<script>
const SUPABASE_URL      = 'https://luocdqquuvgxcpyklmwu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b2NkcXF1dXZneGNweWtsbXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA5NjYsImV4cCI6MjEwNDQ1Njk2Nn0.snOTfxctxig8sKlOUfan19DuMSa2Q56vA5gWdwo4H3A';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STAGES       = ['modelagem3d','extracaoGab','programacao','montagem','preparacao','espumacao','modelagemTec','costura','tapecaria','montFinal'];
const STAGE_LABELS = ['Modelagem 3D','Extração Gabarito','Programação','Montagem','Preparação','Espumação','Modelagem Téc.','Costura','Tapeçaria','Montagem Final'];

let allLogs  = [];   // etapa_logs
let allObs   = [];   // pedido_observacoes
let combined = [];   // merge dos dois
let activeRange    = 1;
let diaEscolhido   = null;   // 'AAAA-MM-DD' quando o filtro é de um dia só
let activeUser     = '';
let activeUserCard = null;
let selectedStages = new Set();  // etapas selecionadas no filtro (vazio = todas)

/* ── DATAS ────────────────────────────────────────── */
/* Um dia só, fechado nas duas pontas. Os atalhos (Hoje / 7 / 30 / Tudo) têm
   apenas o começo e vão até agora; para um dia do passado isso não serve, e
   era o que faltava. */
function setDia(valor) {
  diaEscolhido = valor || null;
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  if (!diaEscolhido) {   // campo limpo: devolve o atalho padrão
    activeRange = 1;
    const p = document.querySelector('.pill[data-range="1"]');
    if (p) p.classList.add('active');
  }
  activeUser = '';
  document.getElementById('filterUser').value = '';
  if (activeUserCard) { activeUserCard.classList.remove('active'); activeUserCard = null; }
  loadAll();
}

function startOfRange(days) {
  if (!days) return null;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - (days - 1));
  return d;
}

function fmtDatetime(iso) {
  const d = new Date(iso);
  const today   = new Date(); today.setHours(0,0,0,0);
  const itemDay = new Date(d); itemDay.setHours(0,0,0,0);
  const diffDays = Math.floor((today - itemDay) / 86400000);
  const time = d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  if (diffDays === 0) return `Hoje, ${time}`;
  if (diffDays === 1) return `Ontem, ${time}`;
  return d.toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' }) + ` ${time}`;
}

/* ── CARGA ────────────────────────────────────────── */
/* O Supabase devolve no máximo 1000 linhas por requisição e o resto some sem
   aviso. Com o filtro em "Tudo" o histórico já passa disso, e como a busca vem
   da mais nova pra mais velha o painel deixaria de contar a atividade antiga
   sem dizer nada. Lê de mil em mil até acabar. */
const PAGINA_SUPABASE = 1000;
async function buscarTudo(montarConsulta) {
  const todas = [];
  for (let inicio = 0; ; inicio += PAGINA_SUPABASE) {
    const { data, error } = await montarConsulta().range(inicio, inicio + PAGINA_SUPABASE - 1);
    if (error) { console.error('Erro ao buscar:', error); return todas; }
    todas.push(...(data || []));
    if (!data || data.length < PAGINA_SUPABASE) return todas;
  }
}

async function loadAll() {
  document.getElementById('lastUpd').textContent = 'Atualizando...';

  const since = diaEscolhido ? new Date(diaEscolhido + 'T00:00:00') : startOfRange(activeRange);
  // só o dia escolhido tem fim; os atalhos correm até agora
  const until = diaEscolhido
    ? new Date(new Date(diaEscolhido + 'T00:00:00').getTime() + 86400000) : null;

  // As ticagens de ficha preenchidas de uma vez nos produtos antigos foram
  // trabalho de migração, não atividade de ninguém: no feed elas afogariam o
  // que as pessoas fizeram de verdade, e nas estatísticas inflariam a conta.
  const montaLogs = () => {
    let q = sb.from('etapa_logs')
      .select('produto, n_pedido, etapa, status, created_at, usuario')
      .neq('usuario', 'retroativo')
      .order('created_at', { ascending: false });
    if (since) q = q.gte('created_at', since.toISOString());
    if (until) q = q.lt('created_at', until.toISOString());
    return q;
  };
  const montaObs = () => {
    let q = sb.from('pedido_observacoes')
      .select('produto, n_pedido, texto, autor, created_at')
      .order('created_at', { ascending: false });
    if (since) q = q.gte('created_at', since.toISOString());
    if (until) q = q.lt('created_at', until.toISOString());
    return q;
  };

  const [logs, obs] = await Promise.all([buscarTudo(montaLogs), buscarTudo(montaObs)]);
  allLogs = logs;
  allObs  = obs;

  // Unifica num feed só
  combined = [
    ...allLogs.map(r => ({
      tipo:     'etapa',
      usuario:  r.usuario || null,
      produto:  r.produto,
      n_pedido: r.n_pedido,
      etapa:    r.etapa,
      status:   r.status,
      texto:    null,
      created_at: r.created_at,
    })),
    ...allObs.map(r => ({
      tipo:     'obs',
      usuario:  r.autor || null,
      produto:  r.produto,
      n_pedido: r.n_pedido,
      etapa:    null,
      status:   null,
      texto:    r.texto,
      created_at: r.created_at,
    })),
  ].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const now = new Date();
  document.getElementById('lastUpd').textContent =
    `Atualizado: ${now.toLocaleTimeString('pt-BR')}`;

  populateUserFilter();
  renderStats();
  renderUsers();
  renderFeed();
}

/* ── FILTROS ──────────────────────────────────────── */
function setRange(days, el) {
  activeRange = days;
  diaEscolhido = null;                       // atalho e dia são excludentes
  const campoDia = document.getElementById('filtroDia');
  if (campoDia) campoDia.value = '';
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  // reset user filter
  activeUser = '';
  document.getElementById('filterUser').value = '';
  if (activeUserCard) { activeUserCard.classList.remove('active'); activeUserCard = null; }
  loadAll();
}

/* Antes a lista saia so' de `combined`, que e' o que o PERIODO escolhido
   trouxe: com "Hoje" aparecia so' quem agiu hoje, e quem nao agiu ficava
   invisivel em vez de aparecer com zero. Agora e' a uniao de todo mundo ativo
   com os nomes que constam nos registros — inclusive gente antiga, como o
   Izaias, que nao e' usuario do sistema mas assina registro. */
async function populateUserFilter() {
  let ativos = [];
  try {
    const { data } = await sb.from('usuarios').select('nome').eq('ativo', true);
    ativos = (data || []).map(u => u.nome);
  } catch (e) { console.error('usuarios do filtro:', e); }
  const users = [...new Set([...ativos, ...combined.map(r => r.usuario).filter(Boolean)])].sort();
  const sel = document.getElementById('filterUser');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todos</option>';
  users.forEach(u => sel.innerHTML += `<option value="${u}">${u}</option>`);
  sel.value = cur;
}

function currentFiltered() {
  const userSel  = document.getElementById('filterUser').value;
  const tipoSel  = document.getElementById('filterTipo').value;
  return combined.filter(r => {
    const okUser  = !userSel  || r.usuario === userSel;
    const okTipo  = !tipoSel  || r.tipo === tipoSel;
    // Filtro de etapas: só aplica em registros do tipo 'etapa'; obs sempre passam
    const okEtapa = r.tipo !== 'etapa' || selectedStages.size === 0 || selectedStages.has(r.etapa);
    return okUser && okTipo && okEtapa;
  });
}

/* ── FILTRO DE ETAPAS ─────────────────────────────── */
function buildStagePills() {
  const container = document.getElementById('stagePills');
  container.innerHTML = '';
  STAGES.forEach((key, i) => {
    const pill = document.createElement('span');
    pill.className = 'stage-pill' + (selectedStages.has(key) ? ' active' : '');
    pill.textContent = STAGE_LABELS[i];
    pill.dataset.key = key;
    pill.onclick = () => toggleStagePill(key, pill);
    container.appendChild(pill);
  });
  updateClearBtn();
}

function toggleStagePill(key, pill) {
  if (selectedStages.has(key)) {
    selectedStages.delete(key);
    pill.classList.remove('active');
  } else {
    selectedStages.add(key);
    pill.classList.add('active');
  }
  updateClearBtn();
  renderFeed();
}

function clearStageFilter() {
  selectedStages.clear();
  document.querySelectorAll('.stage-pill').forEach(p => p.classList.remove('active'));
  updateClearBtn();
  renderFeed();
}

function updateClearBtn() {
  document.getElementById('stageClearBtn').style.display =
    selectedStages.size > 0 ? 'inline-block' : 'none';
}

/* ── STATS ────────────────────────────────────────── */
function renderStats() {
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const acoesHoje = combined.filter(r => new Date(r.created_at) >= hoje).length;
  const users = new Set(combined.map(r => r.usuario).filter(Boolean)).size;
  const done  = allLogs.filter(r => r.status === true).length;
  const obs   = allObs.length;

  document.getElementById('cntTotal').textContent = combined.length;
  document.getElementById('cntUsers').textContent = users;
  document.getElementById('cntDone').textContent  = done;
  document.getElementById('cntObs').textContent   = obs;
  document.getElementById('cntHoje').textContent  = acoesHoje;
}

/* ── USUÁRIOS ─────────────────────────────────────── */
function renderUsers() {
  // Agrupa por usuário
  const map = {};
  combined.forEach(r => {
    const key = r.usuario || '__anonimo__';
    if (!map[key]) map[key] = { nome: r.usuario, total: 0, etapas: 0, obs: 0, produtos: new Set(), ultima: null };
    map[key].total++;
    if (r.tipo === 'etapa') map[key].etapas++;
    if (r.tipo === 'obs')   map[key].obs++;
    map[key].produtos.add(r.produto);
    if (!map[key].ultima || r.created_at > map[key].ultima) map[key].ultima = r.created_at;
  });

  const sorted = Object.values(map).sort((a, b) => b.total - a.total);
  const maxTotal = sorted[0]?.total || 1;

  if (!sorted.length) {
    document.getElementById('userList').innerHTML =
      '<div class="empty-state"><div class="empty-icon">👥</div><div class="empty-text">Nenhuma atividade no período.</div></div>';
    return;
  }

  document.getElementById('userList').innerHTML = sorted.map(u => {
    const isAnon = !u.nome;
    const initials = isAnon ? '?' : u.nome.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
    const pct = Math.round((u.total / maxTotal) * 100);
    const ultimaStr = u.ultima ? fmtDatetime(u.ultima) : '—';

    if (isAnon) {
      return `<div class="no-name-card">
        <div class="no-name-label">⚠ ${u.total} ação(ões) sem usuário identificado</div>
        <div style="font-size:10px;color:var(--text-muted);margin-top:4px">Última: ${ultimaStr}</div>
      </div>`;
    }

    return `<div class="user-card" onclick="filterByUser('${u.nome.replace(/'/g,"\\'")}', this)">
      <div class="user-card-top">
        <div class="user-avatar">${initials}</div>
        <div>
          <div class="user-name">${u.nome}</div>
          <div class="user-last">Última ação: ${ultimaStr}</div>
        </div>
      </div>
      <div class="user-meta">
        <span class="user-tag tag-blue">${u.total} ação(ões)</span>
        <span class="user-tag tag-green">${u.etapas} etapa(s)</span>
        ${u.obs ? `<span class="user-tag tag-accent">${u.obs} obs.</span>` : ''}
        <span class="user-tag tag-gray">${u.produtos.size} produto(s)</span>
      </div>
      <div class="user-bar"><div class="user-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function filterByUser(nome, card) {
  const sel = document.getElementById('filterUser');
  if (activeUser === nome) {
    // deselect
    activeUser = '';
    sel.value = '';
    card.classList.remove('active');
    activeUserCard = null;
  } else {
    activeUser = nome;
    sel.value = nome;
    if (activeUserCard) activeUserCard.classList.remove('active');
    card.classList.add('active');
    activeUserCard = card;
  }
  renderFeed();
}

/* ── FEED ─────────────────────────────────────────── */
function renderFeed() {
  const filtered = currentFiltered();
  document.getElementById('feedCount').textContent = `${filtered.length} registro(s)`;

  if (!filtered.length) {
    document.getElementById('feedList').innerHTML =
      '<div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Nenhum registro encontrado para os filtros selecionados.</div></div>';
    return;
  }

  document.getElementById('feedList').innerHTML = filtered.map(r => {
    const userStr = r.usuario
      ? `<span class="feed-user">👤 ${r.usuario}</span>`
      : `<span class="feed-user" style="color:var(--text-muted)">👤 sem identificação</span>`;

    if (r.tipo === 'etapa') {
      const idx = STAGES.indexOf(r.etapa);
      const label = idx >= 0 ? STAGE_LABELS[idx] : r.etapa;
      const acao  = r.status ? 'concluiu' : 'desmarcou';
      const dotCls = r.status ? 'fd-on' : 'fd-off';
      const prodStr = r.n_pedido ? `${r.produto} <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted)">#${r.n_pedido}</span>` : r.produto;
      return `<div class="feed-item">
        <div class="feed-dot ${dotCls}"></div>
        <div class="feed-body">
          <div class="feed-action">
            <span class="stage-name">${label}</span>
            — ${acao} em
            <span class="product-name">${prodStr}</span>
          </div>
          <div class="feed-meta">
            ${userStr}
            <span class="feed-time">${fmtDatetime(r.created_at)}</span>
            <span class="feed-tipo tipo-etapa">Etapa</span>
          </div>
        </div>
      </div>`;
    } else {
      const prodStr = r.n_pedido ? `${r.produto} <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted)">#${r.n_pedido}</span>` : r.produto;
      return `<div class="feed-item">
        <div class="feed-dot fd-obs"></div>
        <div class="feed-body">
          <div class="feed-action">
            Observação em <span class="product-name">${prodStr}</span>:
            <span style="color:var(--mid)">"${r.texto}"</span>
          </div>
          <div class="feed-meta">
            ${userStr}
            <span class="feed-time">${fmtDatetime(r.created_at)}</span>
            <span class="feed-tipo tipo-obs">Observação</span>
          </div>
        </div>
      </div>`;
    }
  }).join('');
}

/* ── SOLICITAÇÕES ──────────────────────────────────────────── */
let solLista = [], solUsuarios = [], solCarregado = false, solDiasAlerta = 3;
let solPessoaAtiva = null;

const SOL_LBL = { aberta:'Aberta', em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada' };
const solNome = id => (solUsuarios.find(u => u.id === id) || {}).nome || '—';

/* Mesma leitura da tela de solicitações: cobrança disparada pela varredura do
   checklist não tem autor humano — o criador gravado é só quem tinha a tela
   aberta. Aqui o nome real fica na dica, porque o painel é de auditoria. */
const COBRANCAS_DA_VARREDURA = ['Falta a Data de Envio ao PCP', 'Pedido atrasado no PCP'];
const ehCobrancaAutomatica = s =>
  COBRANCAS_DA_VARREDURA.some(t => String(s && s.titulo || '').startsWith(t));
const solAutor = s => ehCobrancaAutomatica(s)
  ? `<span title="Cobrança automática do checklist — disparou no navegador de ${sdEsc(solNome(s.criador_id))}">⚙ Sistema</span>`
  : sdEsc(solNome(s.criador_id));
function solDiasParado(s) { return Math.floor((Date.now() - new Date(s.updated_at).getTime()) / 86400000); }

/* Quanto tempo a solicitação levou da abertura até alguém concluir.
   A hora da conclusão sai de `concluida_em`, coluna própria gravada pelos três
   caminhos que concluem (a mão na tela de solicitações, automática pela ficha
   de custo e automática pelo anexo). NÃO usar `updated_at`: ele também se mexe
   ao gravar a OC e ao encaminhar, e nesses casos o tempo sairia maior do que
   foi de verdade. */
function solDuracaoMs(s) {
  if (s.status !== 'concluida' || !s.concluida_em) return null;
  const ms = new Date(s.concluida_em).getTime() - new Date(s.created_at).getTime();
  return ms >= 0 ? ms : null;   // relógio torto não vira estatística
}

function fmtDuracao(ms) {
  if (ms == null || !isFinite(ms)) return '—';
  const min = Math.round(ms / 60000);
  if (min < 60) return min + 'min';
  const h = Math.floor(min / 60);
  if (h < 24) return h + 'h' + (min % 60 ? ' ' + (min % 60) + 'min' : '');
  const d = Math.floor(h / 24);
  return d + 'd' + (h % 24 ? ' ' + (h % 24) + 'h' : '');
}

function solMediana(v) {
  if (!v.length) return null;
  const a = [...v].sort((x, y) => x - y), m = a.length >> 1;
  return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
}
function solPercentil(v, p) {
  if (!v.length) return null;
  const a = [...v].sort((x, y) => x - y);
  return a[Math.min(a.length - 1, Math.floor(p * a.length))];
}

/* Os números seguem os MESMOS filtros da lista à direita: escolher uma pessoa
   mostra o lead time dela, e não o da empresa inteira. */
function renderSolLeadtime(lista) {
  const el = document.getElementById('solLeadtime');
  if (!el) return;
  const dur = lista.map(solDuracaoMs).filter(v => v != null);
  if (!dur.length) {
    el.innerHTML = `<div class="lt-card"><div class="lt-label">Lead time de resposta</div>
      <div class="lt-num">—</div><div class="lt-sub">nenhuma solicitação concluída nesta seleção</div></div>`;
    return;
  }
  const med = solMediana(dur);
  const avg = dur.reduce((a, b) => a + b, 0) / dur.length;
  const p90 = solPercentil(dur, 0.9);
  /* UM número na tela: a mediana. Antes havia três (mediana, média e p90) lado
     a lado, e eles brigavam entre si — são três respostas para a MESMA
     pergunta, e a média fica quase 5x acima da mediana porque meia dúzia de
     solicitações ficou semanas parada. Quem olhava tinha de decidir em qual
     acreditar. Os outros dois continuam existindo, na dica do mouse, para
     quando alguém quiser conferir. */
  const dica = `${dur.length} solicitação(ões) concluídas nesta seleção`
    + `
Média: ${fmtDuracao(avg)}`
    + (avg > med * 1.5 ? ' — bem acima da mediana, puxada pelas poucas muito demoradas' : '')
    + `
9 em cada 10 foram respondidas em até ${fmtDuracao(p90)}`;
  el.innerHTML = `<div class="lt-card" title="${sdEsc(dica)}">`
    + `<div class="lt-label">Tempo típico de resposta</div>`
    + `<div class="lt-num">${fmtDuracao(med)}</div>`
    + `<div class="lt-sub">metade das ${dur.length} concluídas foi respondida em menos que isso`
    + ` · passe o mouse para média e extremos</div></div>`;
}
function solEstaParada(s) {
  return (s.status === 'aberta' || s.status === 'em_andamento') && solDiasParado(s) >= solDiasAlerta;
}

async function loadSolicitacoes() {
  const [sols, users, cfg] = await Promise.all([
    sb.from('solicitacoes').select('*').order('created_at', { ascending:false }),
    sb.from('usuarios').select('id,nome').order('nome'),
    sb.from('configuracoes').select('valor').eq('chave','dias_alerta_solicitacao').maybeSingle()
  ]);
  if (sols.error) { console.error('Erro ao buscar solicitacoes:', sols.error); return; }
  solLista    = sols.data || [];
  solUsuarios = users.data || [];
  if (cfg.data && cfg.data.valor) solDiasAlerta = parseInt(cfg.data.valor) || 3;
  solCarregado = true;
  popularSolFiltros();
  renderSolPessoas();
  renderSolFeed();
}

function popularSolFiltros() {
  const sel = document.getElementById('solFilterResp');
  const cur = sel.value;
  sel.innerHTML = '<option value="">Todos os responsáveis</option>' +
    solUsuarios.map(u => `<option value="${u.id}">${u.nome}</option>`).join('');
  sel.value = cur;
  const opt = document.querySelector('#solFilterAtraso option[value="paradas"]');
  if (opt) opt.textContent = `Somente paradas (+${solDiasAlerta} dias)`;
}

/* Painel esquerdo: carga por pessoa */
function renderSolPessoas() {
  const el = document.getElementById('solPessoas');
  const stats = solUsuarios.map(u => {
    /* Cancelada fica FORA da conta do cartão. Entrando no total, ele deixava
       de fechar: a Nayara aparecia com "36 total · 14 em aberto · 17
       concluídas" — e 14 + 17 dá 31, não 36. Quem olha lê a diferença como
       trabalho que falta, quando na verdade são solicitações que morreram.
       A lista à direita continua mostrando as canceladas; o que muda é só a
       contagem do cartão. */
    const todas   = solLista.filter(s => s.responsavel_id === u.id);
    const minhas  = todas.filter(s => s.status !== 'cancelada');
    const canceladas = todas.length - minhas.length;
    const abertas = minhas.filter(s => s.status === 'aberta' || s.status === 'em_andamento').length;
    const paradas = minhas.filter(solEstaParada).length;
    const concl   = minhas.filter(s => s.status === 'concluida').length;
    const durs    = minhas.map(solDuracaoMs).filter(v => v != null);
    return { id:u.id, nome:u.nome, total:minhas.length, abertas, paradas, concl,
             canceladas, med: solMediana(durs) };
  }).filter(x => x.total > 0).sort((a,b) => b.abertas - a.abertas || b.total - a.total);

  if (!stats.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📨</div><div class="empty-text">Nenhuma solicitação registrada.</div></div>';
    return;
  }
  const maxAb = Math.max(...stats.map(s => s.abertas), 1);
  el.innerHTML = stats.map(x => {
    const iniciais = x.nome.split(' ').map(w => w[0]).join('').substring(0,2).toUpperCase();
    const pct = Math.round((x.abertas / maxAb) * 100);
    const dica = x.canceladas
      ? ` title="${x.canceladas} cancelada(s) fora da conta — a lista ao lado ainda mostra"` : '';
    return `<div class="user-card"${dica} onclick="filtrarPorPessoa('${x.id}', this)">
      <div class="user-card-top">
        <div class="user-avatar">${iniciais}</div>
        <div>
          <div class="user-name">${x.nome}</div>
          <div class="user-last">${x.abertas} em aberto · ${x.concl} concluída(s)${x.med != null ? ' · ⏱ ' + fmtDuracao(x.med) + ' típico' : ''}</div>
        </div>
      </div>
      <div class="user-meta">
        <span class="user-tag tag-blue">${x.total} total</span>
        <span class="user-tag tag-green">${x.concl} concluída(s)</span>
        ${x.paradas ? `<span class="user-tag tag-accent">⚠ ${x.paradas} parada(s)</span>` : ''}
      </div>
      <div class="user-bar"><div class="user-bar-fill" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function filtrarPorPessoa(id, card) {
  const sel = document.getElementById('solFilterResp');
  if (solPessoaAtiva === id) {
    solPessoaAtiva = null; sel.value = '';
    card.classList.remove('active');
  } else {
    document.querySelectorAll('#solPessoas .user-card').forEach(c => c.classList.remove('active'));
    solPessoaAtiva = id; sel.value = id;
    card.classList.add('active');
  }
  renderSolFeed();
}

/* Painel direito: lista com filtros */
function renderSolFeed() {
  const st     = document.getElementById('solFilterStatus').value;
  const resp   = document.getElementById('solFilterResp').value;
  const atraso = document.getElementById('solFilterAtraso').value;

  const lista = solLista.filter(s => {
    if (st && s.status !== st) return false;
    if (resp && s.responsavel_id !== resp) return false;
    if (atraso === 'paradas' && !solEstaParada(s)) return false;
    return true;
  });

  renderSolLeadtime(lista);
  document.getElementById('solFeedCount').textContent = `${lista.length} solicitação(ões)`;
  const el = document.getElementById('solFeedList');
  if (!lista.length) {
    el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-text">Nada com esses filtros.</div></div>';
    return;
  }

  el.innerHTML = lista.map(s => {
    const destaque = s.produto_ref || s.titulo;
    const sub = s.produto_ref ? ` <span style="color:var(--text-muted);font-weight:400">— ${s.titulo}</span>` : '';
    const pedidoTag = s.pedido_ref
      ? ` <span style="font-family:'DM Mono',monospace;font-size:10px;color:var(--text-muted)">#${s.pedido_ref}</span>` : '';
    const parada = solEstaParada(s)
      ? ` <span class="user-tag tag-accent">⚠ parada ${solDiasParado(s)}d</span>` : '';
    const dur = solDuracaoMs(s);
    const tempo = dur != null
      ? ` <span class="user-tag tag-green" title="Aberta em ${new Date(s.created_at).toLocaleString('pt-BR')}`
        + ` · concluída em ${new Date(s.concluida_em).toLocaleString('pt-BR')}">⏱ ${fmtDuracao(dur)}</span>` : '';
    return `<div class="feed-item" style="cursor:pointer" title="Abrir solicitação" onclick="abrirSolDetalhe('${s.id}')">
      <div class="feed-dot ${s.status === 'concluida' ? 'fd-etapa' : 'fd-obs'}"></div>
      <div class="feed-body">
        <div class="feed-action">
          <span class="stage-name">${destaque}</span>${sub}${pedidoTag}${parada}${tempo}
        </div>
        <div class="feed-meta">
          <span>${solAutor(s)} → <strong>${sdEsc(solNome(s.responsavel_id))}</strong></span>
          <span class="feed-time">${fmtDatetime(s.created_at)}</span>
          <span class="feed-tipo ${s.status === 'concluida' ? 'tipo-etapa' : 'tipo-obs'}">${SOL_LBL[s.status]}</span>
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ── DETALHE DA SOLICITAÇÃO (modal, somente leitura) ──────── */
const SD_IC = { processo:'🔨', comentario:'💬', encaminhamento:'➡️', status:'🔁' };
function sdEsc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function abrirSolDetalhe(id) {
  const s = solLista.find(x => x.id === id);
  if (!s) return;
  document.getElementById('sdTitulo').textContent = s.produto_ref || s.titulo;
  document.getElementById('sdSub').textContent = s.produto_ref ? s.titulo : '';
  const pedido = s.pedido_ref ? ` · Pedido #${sdEsc(s.pedido_ref)}` : '';
  document.getElementById('sdMeta').innerHTML =
    `<span class="sd-pill ${s.status}">${SOL_LBL[s.status]}</span>
     <span>${solAutor(s)} → <strong>${sdEsc(solNome(s.responsavel_id))}</strong></span>
     <span>prioridade: ${sdEsc(s.prioridade)}</span>
     <span>${new Date(s.created_at).toLocaleString('pt-BR')}${pedido}</span>
     ${solEstaParada(s) ? `<span class="user-tag tag-accent">⚠ parada ${solDiasParado(s)}d</span>` : ''}
     ${solDuracaoMs(s) != null ? `<span class="user-tag tag-green">⏱ concluída em ${fmtDuracao(solDuracaoMs(s))}</span>` : ''}`;
  document.getElementById('sdDescricaoWrap').innerHTML = s.descricao
    ? `<div class="sd-label">Descrição</div><div class="sd-desc">${sdEsc(s.descricao)}</div>` : '';

  document.getElementById('sdOverlay').classList.add('open');
  document.getElementById('sdTimeline').innerHTML = '<div class="sd-empty">Carregando...</div>';
  document.getElementById('sdAnexosWrap').innerHTML = '';

  // anexos
  const anx = await sb.from('solicitacao_anexos').select('*').eq('solicitacao_id', id).order('created_at');
  if (anx.data && anx.data.length) {
    /* DXF, DWG e planilha não abrem no navegador: para esses o clique já
       leva ao download, e o `?download=` faz o Storage mandar o arquivo com o
       nome certo em vez de servir inline. */
    const ICONE = [[/\.(dxf|dwg|dwf)$/i,'📐'], [/\.(step|stp|iges|igs|3ds|skp)$/i,'🧊'],
                   [/\.(xlsx|xls|csv)$/i,'📊'], [/\.(docx|doc|txt|rtf)$/i,'📝'],
                   [/\.(zip|rar|7z)$/i,'🗜'], [/\.pdf$/i,'📄']];
    const grid = anx.data.map(a => {
      const ehImg = (a.tipo || '').startsWith('image/');
      const achado = ICONE.find(([re]) => re.test(a.nome || ''));
      const th = ehImg ? `<img class="th" src="${a.url}" alt="">`
                       : `<div class="th">${achado ? achado[1] : '📎'}</div>`;
      const baixar = a.url + (a.url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(a.nome || 'arquivo');
      const abre = ehImg || /\.pdf$/i.test(a.nome || '') || (a.tipo || '').includes('pdf');
      return `<div class="sd-anexo"><a href="${abre ? a.url : baixar}" target="_blank" rel="noopener" title="${sdEsc(a.nome)}">${th}<div class="nm">${sdEsc(a.nome || 'arquivo')}</div></a>`
           + `<a class="bx" href="${baixar}" title="Baixar ${sdEsc(a.nome)}">↓ baixar</a></div>`;
    }).join('');
    document.getElementById('sdAnexosWrap').innerHTML = `<div class="sd-label">Anexos</div><div class="sd-anexos">${grid}</div>`;
  }

  // linha do tempo
  const { data, error } = await sb.from('solicitacao_eventos').select('*')
    .eq('solicitacao_id', id).order('created_at', { ascending:false });
  const tl = document.getElementById('sdTimeline');
  if (error) { tl.innerHTML = '<div class="sd-empty">Erro ao carregar.</div>'; return; }
  if (!data.length) { tl.innerHTML = '<div class="sd-empty">Nenhum registro ainda.</div>'; return; }
  tl.innerHTML = data.map(e => `<div class="sd-tl">
      <div class="ic">${SD_IC[e.tipo] || '•'}</div>
      <div style="flex:1">
        <div class="txt">${sdEsc(e.texto)}</div>
        <div class="m">${sdEsc(solNome(e.autor_id))} · ${new Date(e.created_at).toLocaleString('pt-BR')}</div>
      </div>
    </div>`).join('');
}

function fecharSolDetalhe() {
  document.getElementById('sdOverlay').classList.remove('open');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('sdOverlay').classList.contains('open')) {
    fecharSolDetalhe();
  }
});

</script>
