<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studyo4 — Solicitações</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --cream:#F5F0E8; --dark:#1A1714; --mid:#3D3830; --accent:#C8A96E;
    --red:#C0392B; --orange:#E67E22; --green:#27AE60; --blue:#2E86C1; --roxo:#8E7CC3;
    --border:#E0D8CC; --text-muted:#8A8278;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--cream); color:var(--dark); min-height:100vh; }
  .hidden { display:none !important; }

  header { background:var(--dark); color:var(--cream); padding:12px 26px; display:flex; align-items:center; gap:14px; }
  .brand { font-family:'DM Serif Display',serif; font-size:19px; }
  .brand .accent { color:var(--accent); }
  .spacer { flex:1; }
  .btn-voltar { font-size:11px; font-weight:600; color:var(--cream); background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.15); border-radius:20px; padding:5px 12px; text-decoration:none; white-space:nowrap; }
  .btn-voltar:hover { background:var(--accent); color:var(--dark); }
  .user-chip { font-size:12px; font-weight:600; background:rgba(255,255,255,.1); border-radius:20px; padding:6px 14px; }
  .bell { position:relative; cursor:pointer; font-size:17px; }
  .bell .badge { position:absolute; top:-6px; right:-8px; background:var(--red); color:#fff; font-size:9px; font-weight:700; border-radius:10px; padding:1px 5px; }

  .container { max-width:1000px; margin:0 auto; padding:22px 26px 50px; }
  .toolbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
  .tab { border:1px solid var(--border); background:#fff; border-radius:20px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; }
  .tab.active { background:var(--dark); color:var(--cream); border-color:var(--dark); }
  select, input, textarea { border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-family:'DM Sans',sans-serif; font-size:13px; color:var(--dark); background:#fff; outline:none; }
  select:focus, input:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:64px; width:100%; }
  .btn { border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:600; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .btn-primary { background:var(--dark); color:var(--cream); }
  .btn-primary:hover { opacity:.9; }
  .btn-ghost { background:#fff; border:1px solid var(--border); color:var(--dark); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .btn-sm { padding:6px 11px; font-size:12px; }

  .card-nova { background:#fff; border:1px solid var(--border); border-radius:12px; padding:18px; margin-bottom:18px; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .field-label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; display:block; }
  .full { width:100%; }

  .sol-card { background:#fff; border:1px solid var(--border); border-left:4px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:box-shadow .15s, transform .1s; }
  .sol-card:hover { box-shadow:0 6px 16px rgba(0,0,0,.07); transform:translateY(-1px); }
  .sol-card.p-urgente { border-left-color:var(--red); }
  .sol-card.p-alta    { border-left-color:var(--orange); }
  .sol-card.p-normal  { border-left-color:var(--accent); }
  .sol-card.p-baixa   { border-left-color:var(--border); }
  .sol-card.concluida { opacity:.6; }
  .sol-top { display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
  .sol-titulo { font-weight:700; font-size:15px; flex:1; min-width:180px; }
  .sol-sub { font-size:12px; color:var(--text-muted); margin:3px 0 5px; }
  .sol-meta { font-size:11px; color:var(--text-muted); display:flex; gap:12px; flex-wrap:wrap; }
  .pill { font-size:9px; font-weight:700; border-radius:20px; padding:2px 8px; text-transform:uppercase; letter-spacing:.4px; }
  .pill.aberta { background:#e8eef5; color:var(--blue); }
  .pill.em_andamento { background:#fae9d3; color:var(--orange); }
  .pill.concluida { background:#d5efe0; color:var(--green); }
  .pill.cancelada { background:#eee; color:var(--text-muted); }
  .pill.urgente { background:#f5d5d2; color:var(--red); }
  .pill.alta { background:#fae9d3; color:var(--orange); }
  .pill.link { background:#efe7d6; color:#8a6d3b; }
  .pill.atraso { background:var(--red); color:#fff; }
  .pill.encadeada { background:#e7e2f3; color:var(--roxo); }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; backdrop-filter:blur(2px); }
  .modal { background:#fff; border-radius:14px; width:620px; max-width:100%; max-height:90vh; overflow-y:auto; padding:24px; position:relative; }
  .modal h2 { font-family:'DM Serif Display',serif; font-size:21px; margin-bottom:3px; padding-right:26px; }
  .modal .close { position:absolute; top:14px; right:16px; font-size:24px; cursor:pointer; color:var(--text-muted); }
  .section-label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.5px; margin:18px 0 8px; display:block; border-top:1px solid var(--border); padding-top:14px; }

  .tl-item { display:flex; gap:10px; padding:9px 2px; border-bottom:1px dashed var(--border); font-size:13px; }
  .tl-ic { width:22px; text-align:center; flex-shrink:0; }
  .tl-body { flex:1; }
  .tl-texto { white-space:pre-wrap; word-break:break-word; }  /* respeita as quebras de linha digitadas */
  .tl-meta { font-size:10px; color:var(--text-muted); font-family:'DM Mono',monospace; margin-top:2px; }
  .tl-del { border:none; background:none; color:var(--border); font-size:18px; line-height:1; cursor:pointer; padding:0 2px; flex-shrink:0; transition:color .15s; }
  .tl-item:hover .tl-del { color:var(--text-muted); }
  .tl-del:hover { color:var(--red) !important; }
  .empty { color:var(--text-muted); font-size:13px; text-align:center; padding:20px; }

  /* CONFERÊNCIA DO ESP/ (medidas da peça física, 3D e ficha técnica) */
  .conf-box { background:#faf6ee; border:1px solid var(--border); border-radius:10px; padding:12px 14px; }
  .conf-cab { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .conf-cab b { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:#8a6d3b; }
  .conf-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:9px 12px; }
  .conf-campo label { font-size:10px; font-weight:600; color:var(--text-muted);
                      text-transform:uppercase; letter-spacing:.4px; display:block; margin-bottom:3px; }
  .conf-campo input { width:100%; box-sizing:border-box; }
  .conf-sn { display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:7px 0;
             border-bottom:1px dashed var(--border); font-size:13px; }
  .conf-sn > span:first-child { flex:1; min-width:150px; }
  .conf-sn .opts { display:flex; gap:4px; }
  .conf-sn button { border:1px solid var(--border); background:#fff; border-radius:20px;
                    padding:3px 13px; font-size:12px; cursor:pointer; font-family:inherit; }
  .conf-sn button.on-sim { background:#d5efe0; border-color:#1a6e40; color:#1a6e40; font-weight:700; }
  .conf-sn button.on-nao { background:#f7d9d6; border-color:var(--red); color:var(--red); font-weight:700; }
  .conf-sn button:disabled { cursor:default; opacity:.75; }
  .conf-resumo { display:flex; gap:6px; flex-wrap:wrap; }
  .conf-pill { font-size:11px; border-radius:20px; padding:2px 9px; background:#eee; color:var(--text-muted); }
  .conf-pill.sim { background:#d5efe0; color:#1a6e40; }
  .conf-pill.nao { background:#f7d9d6; color:var(--red); }
  .anexos-grid { display:flex; flex-wrap:wrap; gap:8px; }
  .anexo { position:relative; width:78px; }
  .anexo a { display:block; text-decoration:none; color:var(--dark); }
  .anexo .thumb { width:78px; height:78px; border:1px solid var(--border); border-radius:8px; object-fit:cover; background:#faf7f1; display:flex; align-items:center; justify-content:center; font-size:26px; }
  img.thumb { display:block; }
  .anexo .nome { font-size:9px; color:var(--text-muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .anexo .del { position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:var(--red); color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer; display:none; }
  /* Sempre visivel, e nao so' no hover: o comprador precisa achar o download
     sem descobrir que tem de passar o mouse por cima. */
  .anexo .baixar { display:block; text-align:center; font-size:9px; letter-spacing:.3px;
                   color:var(--text-muted); text-decoration:none; border:1px solid var(--border);
                   border-radius:5px; padding:2px 0; margin-top:3px; background:#fff; }
  .anexo .baixar:hover { color:var(--dark); border-color:var(--accent); }
  .anexo:hover .del { display:block; }
  .notif-item { border-bottom:1px solid var(--border); padding:10px 2px; font-size:13px; }
  .notif-item.unread { background:#faf6ee; }
  .notif-item .m { color:var(--text-muted); font-size:11px; margin-top:2px; }

  /* IMPRESSÃO DE UMA SOLICITAÇÃO */
  #printSolArea { display:none; }
  @media print {
    @page { size: A4 portrait; margin: 15mm; }
    html, body { height:auto !important; overflow:visible !important; }
    body.printing-sol > *:not(#printSolArea) { display:none !important; }
    body.printing-sol #printSolArea { display:block !important; color:#000; }
    #printSolArea .ps-head { border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px; }
    #printSolArea .ps-company { font-family:'DM Serif Display',serif; font-size:20px; }
    #printSolArea .ps-doc { font-size:11px; color:#444; margin-top:2px; }
    #printSolArea h1 { font-family:'DM Serif Display',serif; font-size:20px; margin:14px 0 8px; }
    #printSolArea .ps-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 20px; font-size:12px; margin-bottom:12px; }
    #printSolArea .ps-grid .k { color:#555; font-size:10px; text-transform:uppercase; letter-spacing:.5px; }
    #printSolArea .ps-label { font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:#555; border-top:1px solid #999; padding-top:8px; margin:14px 0 6px; font-weight:600; }
    #printSolArea .ps-desc { font-size:13px; white-space:pre-wrap; }
    #printSolArea .ps-ev { border-bottom:1px dashed #bbb; padding:6px 0; font-size:12px; page-break-inside:avoid; }
    #printSolArea .ps-ev .t { white-space:pre-wrap; word-break:break-word; }
    #printSolArea .ps-imgs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:8px; }
    #printSolArea .ps-imgs img { max-width:48%; max-height:80mm; border:1px solid #ccc; object-fit:contain; }
    #printSolArea .ps-ev .m { font-size:10px; color:#555; margin-top:2px; }
    #printSolArea .ps-sign { margin-top:40px; display:flex; justify-content:space-between; gap:40px; }
    #printSolArea .ps-sign div { flex:1; border-top:1px solid #000; padding-top:5px; font-size:11px; text-align:center; color:#333; }
    #printSolArea .ps-foot { margin-top:16px; font-size:9px; color:#888; }
  }
</style>
</head>
<body>

<header>
  <a class="btn-voltar" href="index.html">← Início</a>
  <div class="brand">Solicita<span class="accent">ções</span></div>
  <div class="spacer"></div>
  <div class="bell" onclick="abrirNotificacoes()" title="Notificações">🔔<span class="badge hidden" id="bellBadge">0</span></div>
  <div class="user-chip" id="userChip">—</div>
</header>

<div class="container">
  <div class="toolbar">
    <div class="tab active" id="tab-minhas"   onclick="setFiltro('minhas',this)">Minhas tarefas</div>
    <div class="tab"        id="tab-criadas"  onclick="setFiltro('criadas',this)">Criadas por mim</div>
    <div class="tab"        id="tab-todas"    onclick="setFiltro('todas',this)">Todas</div>
    <input type="text" id="buscaSolic" placeholder="Buscar pedido, produto ou título..."
           oninput="renderLista()" style="width:230px;padding:7px 10px;font-size:13px">
    <select id="filtroStatus" onchange="renderLista()">
      <option value="abertas">Em aberto</option>
      <option value="">Todos os status</option>
      <option value="aberta">Aberta</option>
      <option value="em_andamento">Em andamento</option>
      <option value="concluida">Concluída</option>
      <option value="cancelada">Cancelada</option>
    </select>
    <div style="flex:1"></div>
    <span id="contador" style="font-family:'DM Mono',monospace;font-size:11px;color:var(--text-muted)"></span>
    <button class="btn btn-primary btn-sm" onclick="toggleNova()">+ Nova solicitação</button>
  </div>

  <div class="card-nova hidden" id="cardNova">
    <label class="field-label">Título</label>
    <input class="full" id="nvTitulo" placeholder="Ex: Alterar documentação e arquivos de corte do LANDSCAPE">
    <label class="field-label" style="margin-top:10px">Descrição (opcional)</label>
    <textarea id="nvDescricao" placeholder="Detalhe o que precisa ser feito..."></textarea>
    <div class="grid2" style="margin-top:10px">
      <div>
        <label class="field-label">Responsável</label>
        <select class="full" id="nvResponsavel"></select>
      </div>
      <div>
        <label class="field-label">Prioridade</label>
        <select class="full" id="nvPrioridade">
          <option value="baixa">Baixa</option>
          <option value="normal" selected>Normal</option>
          <option value="alta">Alta</option>
          <option value="urgente">Urgente</option>
        </select>
      </div>
      <div>
        <label class="field-label">Nº Pedido (opcional)</label>
        <input class="full" id="nvPedido" placeholder="Ex: 117043">
      </div>
      <div>
        <label class="field-label">Produto (opcional)</label>
        <input class="full" id="nvProduto" placeholder="Ex: CAMA DELFT QUEEN">
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="toggleNova()">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="btnCriar" onclick="criarSolicitacao()">Criar solicitação</button>
    </div>
  </div>

  <div id="lista"><div class="empty">Carregando...</div></div>
</div>

<!-- DETALHE -->
<div class="overlay" id="detOverlay">
  <div class="modal">
    <span class="close" onclick="fecharOverlay('detOverlay')">&times;</span>
    <h2 id="detTitulo">—</h2>
    <div id="detSubtitulo" style="font-size:13px;color:var(--text-muted);margin-bottom:6px"></div>
    <div class="sol-meta" id="detMeta"></div>
    <button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="printSolicitacao()">🖨️ Imprimir</button>
    <div id="detDescricao" style="margin-top:12px;font-size:13px;white-space:pre-wrap"></div>

    <div id="detOC" style="margin-top:12px"></div>
    <div id="detConferencia" style="margin-top:12px"></div>

    <span class="section-label">Anexos (fotos / desenhos)</span>
    <div id="detAnexos"><div class="empty">Carregando...</div></div>
    <div style="margin-top:8px">
      <!-- DXF e DWG nao tem tipo MIME padrao: o navegador manda vazio e o
           `accept` so' funciona pela extensao. Por isso a lista mistura os
           dois jeitos, e quem precisar de um formato fora dela ainda pode
           escolher "Todos os arquivos" na janela do Windows. -->
      <input type="file" id="anexoInput" multiple style="display:none" onchange="enviarAnexos()"
             accept="image/*,.pdf,.dxf,.dwg,.dwf,.step,.stp,.iges,.igs,.skp,.3ds,.xlsx,.xls,.csv,.docx,.doc,.zip,.rar,.7z">
      <button class="btn btn-ghost btn-sm" id="btnAnexar" onclick="document.getElementById('anexoInput').click()">📎 Anexar arquivo</button>
      <span id="anexoStatus" style="font-size:11px;color:var(--text-muted);margin-left:8px"></span>
    </div>

    <span class="section-label">Linha do tempo</span>
    <div id="detTimeline"><div class="empty">Carregando...</div></div>

    <span class="section-label">Ações</span>
    <div id="detAcoes"></div>
  </div>
</div>

<!-- ENCAMINHAR -->
<div class="overlay" id="encOverlay">
  <div class="modal" style="width:460px">
    <span class="close" onclick="fecharOverlay('encOverlay')">&times;</span>
    <h2>Encaminhar</h2>
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px">
      Cria uma <b>nova solicitação</b> para outra pessoa, encadeada a esta.
    </div>
    <label class="field-label" style="margin-top:10px">Para quem</label>
    <select class="full" id="encPara"></select>
    <label class="field-label" style="margin-top:10px">Título da nova solicitação</label>
    <input class="full" id="encTitulo" placeholder="Ex: Comprar chapa p/ corte a laser">
    <label class="field-label" style="margin-top:10px">Observação do encaminhamento</label>
    <textarea id="encTexto" placeholder="O que a pessoa precisa saber..."></textarea>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
      <button class="btn btn-ghost btn-sm" onclick="fecharOverlay('encOverlay')">Cancelar</button>
      <button class="btn btn-primary btn-sm" id="btnEnc" onclick="confirmarEncaminhar()">Encaminhar</button>
    </div>
  </div>
</div>

<!-- NOTIFICAÇÕES -->
<div class="overlay" id="notifOverlay">
  <div class="modal" style="width:440px">
    <span class="close" onclick="fecharOverlay('notifOverlay')">&times;</span>
    <h2>Notificações</h2>
    <div id="notifList"><div class="empty">Carregando...</div></div>
  </div>
</div>

<!-- ÁREA DE IMPRESSÃO (uma solicitação) -->
<div id="printSolArea"></div>

<script>
const SUPABASE_URL = 'https://luocdqquuvgxcpyklmwu.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx1b2NkcXF1dXZneGNweWtsbXd1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg4ODA5NjYsImV4cCI6MjEwNDQ1Njk2Nn0.snOTfxctxig8sKlOUfan19DuMSa2Q56vA5gWdwo4H3A';
const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
const SESSAO_KEY = 'studyo4_sessao';
const PUSH_FN = 'quick-endpoint';   // slug da Edge Function que envia o push

let sessao = null, usuarios = [], solicitacoes = [], filtro = 'minhas', diasAlerta = 3, detAtual = null, detEventos = [], detAnexos = [];

const LBL_STATUS = { aberta:'Aberta', em_andamento:'Em andamento', concluida:'Concluída', cancelada:'Cancelada' };
const IC_EVENTO  = { processo:'🔨', comentario:'💬', encaminhamento:'➡️', status:'🔁' };

/* ── SESSÃO ─────────────────────────────────────────── */
function carregarSessao() {
  try { sessao = JSON.parse(localStorage.getItem(SESSAO_KEY) || 'null'); } catch (e) { sessao = null; }
  if (!sessao || !sessao.id) { location.href = 'index.html'; return false; }
  document.getElementById('userChip').textContent = '👤 ' + sessao.nome;
  // "Todas" é de admin: para os outros a aba sai da tela, e a lista nem chega
  // do banco (ver carregarSolicitacoes).
  if (!sessao.admin) {
    const t = document.getElementById('tab-todas');
    if (t) t.remove();
  }
  return true;
}
const nomeDe = id => (usuarios.find(u => u.id === id) || {}).nome || '—';

/* ── CARGA ──────────────────────────────────────────── */
async function carregarUsuarios() {
  const { data } = await sb.from('usuarios').select('id,nome,setor').eq('ativo', true).order('nome');
  usuarios = data || [];
  compradores = new Set(usuarios.filter(u => ehSetorCompras(u.setor)).map(u => u.id));
  const opts = usuarios.map(u => `<option value="${u.id}">${u.nome}</option>`).join('');
  document.getElementById('nvResponsavel').innerHTML = opts;
  document.getElementById('encPara').innerHTML = opts;
}

async function carregarConfig() {
  const { data } = await sb.from('configuracoes').select('valor').eq('chave','dias_alerta_solicitacao').maybeSingle();
  if (data && data.valor) diasAlerta = parseInt(data.valor) || 3;
}

async function carregarSolicitacoes() {
  /* Quem não é admin enxerga só o que é seu: o que lhe pediram e o que ele
     pediu. O recorte é na CONSULTA e não na tela — peneirar só no render
     deixaria a lista inteira carregada no navegador, e a busca desta tela
     passa por cima da aba de propósito, então esconder a aba não bastaria. */
  let q = sb.from('solicitacoes').select('*').order('created_at', { ascending:false });
  if (!sessao.admin) q = q.or(`responsavel_id.eq.${sessao.id},criador_id.eq.${sessao.id}`);
  const { data, error } = await q;
  if (error) { document.getElementById('lista').innerHTML = '<div class="empty">Erro ao carregar. Rodou o SQL da Fase 1?</div>'; return; }
  solicitacoes = data || [];
  // contagem de eventos e de anexos por solicitação
  const { data: evs } = await sb.from('solicitacao_eventos').select('solicitacao_id');
  const cont = {};
  (evs || []).forEach(e => cont[e.solicitacao_id] = (cont[e.solicitacao_id] || 0) + 1);
  const anx = await sb.from('solicitacao_anexos').select('solicitacao_id');
  const contA = {};
  (anx.data || []).forEach(a => contA[a.solicitacao_id] = (contA[a.solicitacao_id] || 0) + 1);
  solicitacoes.forEach(s => { s._eventos = cont[s.id] || 0; s._anexos = contA[s.id] || 0; });
  renderLista();
  verificarAtrasadas();
}

/* ── LISTA ──────────────────────────────────────────── */
function setFiltro(f, el) {
  filtro = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');   // a aba "Todas" não existe para todo mundo
  renderLista();
}

function diasParados(s) {
  return Math.floor((Date.now() - new Date(s.updated_at).getTime()) / 86400000);
}

function renderLista() {
  const st = document.getElementById('filtroStatus').value;
  const busca = (document.getElementById('buscaSolic').value || '').trim().toLowerCase();
  /* A busca passa por cima da aba escolhida. Quem digita um número de pedido
     quer achar AQUELE pedido — não quer descobrir depois que ele existia, mas
     estava em "Todas" enquanto a tela mostrava "Minhas tarefas".
     Para quem não é admin isso continua valendo, só que dentro do que é dele:
     a consulta já trouxe apenas as suas. */
  let lista = solicitacoes.filter(s => {
    if (!busca) {
      if (filtro === 'minhas'  && s.responsavel_id !== sessao.id) return false;
      if (filtro === 'criadas' && s.criador_id     !== sessao.id) return false;
    } else {
      const alvo = [s.pedido_ref, s.produto_ref, s.titulo, s.descricao,
                    nomeDe(s.responsavel_id), nomeDe(s.criador_id)]
                   .map(x => String(x || '').toLowerCase()).join(' | ');
      if (!alvo.includes(busca)) return false;
    }
    if (st === 'abertas') return s.status === 'aberta' || s.status === 'em_andamento';
    if (st) return s.status === st;
    return true;
  });
  document.getElementById('contador').textContent =
    `${lista.length} solicitação(ões)`
    + (busca ? (sessao.admin ? ' — buscando em todas' : ' — buscando em todas as suas') : '');
  const el = document.getElementById('lista');
  if (!lista.length) { el.innerHTML = '<div class="empty">Nenhuma solicitação por aqui.</div>'; return; }

  el.innerHTML = lista.map(s => {
    const atrasada = (s.status === 'aberta' || s.status === 'em_andamento') && diasParados(s) >= diasAlerta;
    // Produto em destaque; se não houver, o título assume o destaque
    const destaque = s.produto_ref ? esc(s.produto_ref) : esc(s.titulo);
    const subtitulo = s.produto_ref ? esc(s.titulo) : '';
    const pedidoTag = s.pedido_ref ? `<span class="pill link">#${esc(s.pedido_ref)}</span>` : '';
    return `<div class="sol-card p-${s.prioridade} ${s.status==='concluida'?'concluida':''}" onclick="abrirDetalhe('${s.id}')">
      <div class="sol-top">
        <span class="pill ${s.status}">${LBL_STATUS[s.status]}</span>
        ${['urgente','alta'].includes(s.prioridade) ? `<span class="pill ${s.prioridade}">${s.prioridade}</span>` : ''}
        <span class="sol-titulo">${destaque}</span>
        ${atrasada ? `<span class="pill atraso">parada ${diasParados(s)}d</span>` : ''}
        ${s.origem_solicitacao_id ? '<span class="pill encadeada">encadeada</span>' : ''}
      </div>
      ${subtitulo ? `<div class="sol-sub">${subtitulo}</div>` : ''}
      <div class="sol-meta">
        <span>${nomeDe(s.criador_id)} → <b>${nomeDe(s.responsavel_id)}</b></span>
        ${pedidoTag}
        <span>${s._eventos} registro(s)</span>
        ${s._anexos ? `<span>📎 ${s._anexos}</span>` : ''}
        <span>${new Date(s.created_at).toLocaleDateString('pt-BR')}</span>
      </div>
    </div>`;
  }).join('');
}

/* ── NOVA ───────────────────────────────────────────── */
function toggleNova() {
  const c = document.getElementById('cardNova');

  if (!c.classList.contains('hidden')) document.getElementById('nvTitulo').focus();
}

async function criarSolicitacao() {
  const btn = document.getElementById('btnCriar');
  const titulo = document.getElementById('nvTitulo').value.trim();
  if (!titulo) { alert('Informe o título.'); return; }
  btn.disabled = true;
  try {
    const respId = document.getElementById('nvResponsavel').value;
    const { data, error } = await sb.from('solicitacoes').insert({
      titulo,
      descricao: document.getElementById('nvDescricao').value.trim() || null,
      criador_id: sessao.id,
      responsavel_id: respId,
      prioridade: document.getElementById('nvPrioridade').value,
      pedido_ref: document.getElementById('nvPedido').value.trim() || null,
      produto_ref: document.getElementById('nvProduto').value.trim() || null
    }).select().single();
    if (error) throw error;
    await notificar(respId, 'Nova solicitação para você', titulo, data.id);

      `${titulo} → ${nomeDe(respId)}`, data.id, [respId]);

  // era ela que provava quem respondeu o quê e quando. Ninguém exclui — nem
  // o autor, nem admin. O bloqueio de verdade está no banco (a política de
  // DELETE foi removida); aqui só sumiu o botão que convidava a tentar.
  tl.innerHTML = data.map(e => {

// escapa texto para HTML (evita quebrar o layout com < > &)
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function carregarAnexos(id) {

/* Nem todo anexo abre no navegador. DXF, DWG e planilha o Chrome ou baixa
   sozinho ou mostra lixo na tela, entao para esses o clique JA e' o download e
   nao existe "abrir". Para imagem e PDF o clique abre, e o botao de baixar
   fica ao lado para quem quer o arquivo na maquina. */
const ANEXO_ICONES = [
  [/\.(dxf|dwg|dwf)$/i,        '\u{1F4D0}', 'desenho CAD'],
  [/\.(step|stp|iges|igs|3ds|skp)$/i, '\u{1F9CA}', 'modelo 3D'],
  [/\.(xlsx|xls|csv)$/i,       '\u{1F4CA}', 'planilha'],
  [/\.(docx|doc|txt|rtf)$/i,   '\u{1F4DD}', 'documento'],
  [/\.(zip|rar|7z)$/i,         '\u{1F5DC}', 'compactado'],
  [/\.pdf$/i,                  '\u{1F4C4}', 'PDF']
];

function anexoTipo(a) {
  const nome = a.nome || '';
  if ((a.tipo || '').startsWith('image/')) return { icone: '', rotulo: 'imagem', abre: true };
  for (const [re, icone, rotulo] of ANEXO_ICONES) {
    if (re.test(nome)) return { icone, rotulo, abre: /\.pdf$/i.test(nome) };
  }
  if ((a.tipo || '').includes('pdf')) return { icone: '\u{1F4C4}', rotulo: 'PDF', abre: true };
  return { icone: '\u{1F4CE}', rotulo: 'arquivo', abre: false };
}

/* O Storage serve tudo como "inline". O `?download=` faz o servidor mandar
   Content-Disposition: attachment com o nome certo — o atributo `download` do
   link nao serve aqui, porque o arquivo vem de outro dominio e o navegador o
   ignora. */
function urlBaixar(a) {
  return a.url + (a.url.includes('?') ? '&' : '?') + 'download=' + encodeURIComponent(a.nome || 'arquivo');
}

function renderAnexos() {
  const el = document.getElementById('detAnexos');
  if (!detAnexos.length) { el.innerHTML = '<div class="empty">Nenhum anexo.</div>'; return; }
  el.innerHTML = '<div class="anexos-grid">' + detAnexos.map(a => {
    const t = anexoTipo(a);
    const ehImg = (a.tipo || '').startsWith('image/');
    const thumb = ehImg
      ? `<img class="thumb" src="${a.url}" alt="${esc(a.nome)}">`
      : `<div class="thumb">${t.icone}</div>`;
    const podeExcluir = a.autor_id === sessao.id || sessao.admin;
    // Quem nao abre no navegador vai direto para o download: mandar a pessoa
    // para uma aba com lixo na tela e' pior do que nao ter link.
    const destino = t.abre || ehImg ? a.url : urlBaixar(a);
    const dica = t.abre || ehImg ? `Abrir \u2014 ${esc(a.nome)}` : `Baixar \u2014 ${esc(a.nome)} (${t.rotulo})`;
    return `<div class="anexo">
      <a href="${destino}" target="_blank" rel="noopener" title="${dica}">
        ${thumb}
        <div class="nome">${esc(a.nome || 'arquivo')}</div>
      </a>
      <a class="baixar" href="${urlBaixar(a)}" title="Baixar ${esc(a.nome)}">\u2193 baixar</a>
      ${podeExcluir ? `<button class="del" title="Excluir anexo" onclick="excluirAnexo('${a.id}')">&times;</button>` : ''}
    </div>`;
  }).join('') + '</div>';
}

async function enviarAnexos() {
  const input = document.getElementById('anexoInput');
  const files = [...input.files];
  input.value = '';
  if (!files.length || !detAtual) return;
  const btn = document.getElementById('btnAnexar');
  const status = document.getElementById('anexoStatus');
  btn.disabled = true;
  let ok = 0;
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    status.textContent = `Enviando ${i+1}/${files.length}...`;
    if (file.size > 15 * 1024 * 1024) { alert(`"${file.name}" tem mais de 15MB — pulado.`); continue; }
    try {
      const limpo = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
      const caminho = `${detAtual.id}/${Date.now()}_${limpo}`;
      const up = await sb.storage.from('anexos').upload(caminho, file, { contentType: file.type || 'application/octet-stream' });
      if (up.error) throw up.error;
      const { data: pub } = sb.storage.from('anexos').getPublicUrl(caminho);
      const ins = await sb.from('solicitacao_anexos').insert({
        solicitacao_id: detAtual.id, url: pub.publicUrl, caminho, nome: file.name, tipo: file.type, autor_id: sessao.id
      });
      if (ins.error) throw ins.error;
      ok++;
    } catch (e) {
      console.error(e);
      alert(`Erro ao enviar "${file.name}": ${e.message}`);
    }
  }
  status.textContent = ok ? `${ok} anexo(s) enviado(s).` : '';
  setTimeout(() => status.textContent = '', 3000);
  btn.disabled = false;
  await carregarAnexos(detAtual.id);
}

async function excluirAnexo(id) {
  const a = detAnexos.find(x => x.id === id);
  if (!a) return;
  if (a.autor_id !== sessao.id && !sessao.admin) { alert('Você só pode excluir os anexos que você enviou.'); return; }
  if (!confirm('Excluir este anexo?')) return;
  await sb.storage.from('anexos').remove([a.caminho]);
  const { error } = await sb.from('solicitacao_anexos').delete().eq('id', id);
  if (error) { alert('Erro ao excluir: ' + error.message); return; }
  await carregarAnexos(detAtual.id);
}

/* ── OC DE COMPRA (comprador registra a Ordem de Compra) ──
   Antes o campo só aparecia quando o título começava com "Compras", ou seja,
   só nas solicitações que o checklist abre sozinho. O comprador também recebe
   solicitações escritas à mão, com qualquer título, e nessas não tinha onde
   pôr a OC. Agora vale a pergunta certa: isto está na mão de um comprador? */
let compradores = new Set();
function ehSetorCompras(setor) { return String(setor || '').trim().toLowerCase() === 'compras'; }
function ehCompras(s) {
  return (s.titulo || '').toLowerCase().startsWith('compras') || compradores.has(s.responsavel_id);
}
function podeSetarOC(s) { return sessao.admin || sessao.id === s.responsavel_id; }

/* ── CONFERÊNCIA DO ESP/ ────────────────────────────────────────────
   Quando um ESP/ fecha todas as etapas, quem cuida de 3D e documentação
   recebe uma solicitação para conferir a peça FÍSICA antes de desenhar
   qualquer coisa. O que ele responde aqui não é recado de solicitação: é
   medida do produto construído, e serve depois para a ficha técnica, para o
   bloco 3D e para conferir o próximo igual. Por isso mora em
   `produto_conferencia`, com uma linha por produto, e não no texto daqui.

   A linha já existe quando a solicitação nasce (o checklist cria as duas
   juntas), então achamos pelo `solicitacao_id` e nunca pelo nome do produto. */
const CONF_MEDIDAS = [
  ['largura',           'Largura'],
  ['profundidade',      'Profundidade'],
  ['altura',            'Altura'],
  ['largura_braco',     'Largura de braço'],
  ['altura_assento',    'Altura de assento'],
  ['prof_livre_sentar', 'Profundidade livre do sentar']
];
const CONF_SIMNAO = [
  ['medicoes_ok',   'Medições conferem com o projeto'],
  ['bloco_3d',      'Bloco 3D'],
  ['ficha_tecnica', 'Ficha técnica']
];
let detConf = null;          // linha de produto_conferencia da solicitação aberta

function ehConferencia(s) {
  return (s.titulo || '').toLowerCase().startsWith('conferir medidas');
}
// mesma regra da OC: quem é dono da solicitação preenche; admin destrava
function podeConferir(s) { return sessao.admin || sessao.id === s.responsavel_id; }

async function carregarConferencia(s) {
  const el = document.getElementById('detConferencia');
  detConf = null;
  if (!ehConferencia(s)) { el.innerHTML = ''; return; }
  el.innerHTML = '<div class="empty">Carregando conferência...</div>';
  const { data, error } = await sb.from('produto_conferencia')
    .select('*').eq('solicitacao_id', s.id).maybeSingle();
  if (error) {
    el.innerHTML = '<div class="empty" style="text-align:left;padding:8px">Não consegui carregar a conferência.</div>';
    return;
  }
  detConf = data || { solicitacao_id: s.id };
  renderConferencia();
}

function renderConferencia() {
  const s = detAtual, c = detConf;
  const el = document.getElementById('detConferencia');
  if (!c) { el.innerHTML = ''; return; }
  const editar = podeConferir(s) && s.status !== 'cancelada';

  const simNao = CONF_SIMNAO.map(([k, rotulo]) => {
    const v = c[k];
    const bt = (valor, texto, cls) =>
      `<button class="${v === valor ? cls : ''}" ${editar ? `onclick="marcarConf('${k}', ${valor})"` : 'disabled'}>${texto}</button>`;
    return `<div class="conf-sn"><span>${rotulo}</span>
      <div class="opts">${bt(true, 'Sim', 'on-sim')}${bt(false, 'Não', 'on-nao')}</div></div>`;
  }).join('');

  const medidas = CONF_MEDIDAS.map(([k, rotulo]) => `<div class="conf-campo">
      <label for="conf-${k}">${rotulo} (m)</label>
      <input id="conf-${k}" value="${esc(c[k] || '')}" ${editar ? '' : 'disabled'} placeholder="—">
    </div>`).join('');

  const quando = c.atualizado_em && (c.largura || c.medicoes_ok != null)
    ? `<span style="font-size:11px;color:var(--text-muted)">salvo em ${new Date(c.atualizado_em).toLocaleString('pt-BR')}</span>` : '';

  el.innerHTML = `<div class="conf-box">
    <div class="conf-cab"><b>📐 Conferência da peça física</b>${quando}</div>
    ${simNao}
    <div style="margin:12px 0 4px"><span class="field-label">Medições da peça física</span></div>
    <div class="conf-grid">${medidas}</div>
    <div style="margin-top:10px">
      <label class="field-label" for="conf-obs">Observação (o que divergiu, se divergiu)</label>
      <textarea id="conf-obs" rows="2" style="width:100%;box-sizing:border-box" ${editar ? '' : 'disabled'}>${esc(c.observacao || '')}</textarea>
    </div>
    ${editar
      ? `<button class="btn btn-primary btn-sm" style="margin-top:10px" onclick="salvarConferencia()">Salvar conferência</button>
         <span id="confStatus" style="font-size:11px;color:var(--text-muted);margin-left:8px"></span>`
      : `<div style="font-size:11px;color:var(--text-muted);margin-top:8px">Só ${esc(nomeDe(s.responsavel_id))} preenche esta conferência.</div>`}
  </div>`;
}

/* Sim/Não gravam na hora: são um clique, e perder o clique porque a pessoa
   fechou a modal antes de salvar seria pior do que uma ida ao banco. */
async function marcarConf(campo, valor) {
  if (!detConf) return;
  detConf[campo] = (detConf[campo] === valor) ? null : valor;   // reclicar limpa
  renderConferencia();
  await gravarConferencia({ [campo]: detConf[campo] });
}

async function salvarConferencia() {
  const st = document.getElementById('confStatus');
  const dados = { observacao: document.getElementById('conf-obs').value.trim() || null };
  CONF_MEDIDAS.forEach(([k]) => {
    dados[k] = document.getElementById('conf-' + k).value.trim() || null;
  });
  Object.assign(detConf, dados);
  if (st) st.textContent = 'Salvando...';
  const ok = await gravarConferencia(dados, true);
  if (st) st.textContent = ok ? 'Salvo.' : 'Não consegui salvar.';
}

/* `upsert` com a chave do produto: a linha já nasceu junto da solicitação,
   mas se alguém apagou (ou é uma solicitação antiga, de antes disto), ela se
   recria em vez de a tela travar. */
async function gravarConferencia(dados, registrarNaLinha) {
  try {
    const s = detAtual;
    const linha = { ...detConf, ...dados, solicitacao_id: s.id,
                    conferido_por: sessao.id, atualizado_em: new Date().toISOString() };
    if (!linha.produto_id) {
      const { data: p } = await sb.from('produtos').select('id')
        .eq('produto', s.produto_ref || '').eq('n_pedido', s.pedido_ref || '').maybeSingle();
      if (!p) { alert('Não achei o produto desta solicitação para guardar a conferência.'); return false; }
      linha.produto_id = p.id;
      detConf.produto_id = p.id;
    }
    const { error } = await sb.from('produto_conferencia').upsert(linha, { onConflict: 'produto_id' });
    if (error) throw error;
    // A linha do tempo é o que prova o que foi conferido e quando.
    if (registrarNaLinha) {
      await sb.from('solicitacao_eventos').insert({ solicitacao_id: s.id, autor_id: sessao.id,
        tipo: 'processo', texto: '📐 Conferência atualizada — ' + resumoConferencia(linha) });
      await notificar(s.criador_id, 'Conferência atualizada', `${s.titulo}: ${resumoConferencia(linha)}`, s.id);
      await abrirDetalhe(s.id);
    }
    return true;
  } catch (e) {
    console.error('conferência:', e);
    alert('Erro ao salvar a conferência: ' + e.message);
    return false;
  }
}

function resumoConferencia(c) {
  const sn = v => v == null ? '—' : (v ? 'sim' : 'não');
  const med = CONF_MEDIDAS.filter(([k]) => c[k]).map(([k, r]) => `${r.toLowerCase()} ${c[k]}`).join(', ');
  return `medições: ${sn(c.medicoes_ok)} · bloco 3D: ${sn(c.bloco_3d)} · ficha técnica: ${sn(c.ficha_tecnica)}`
       + (med ? ` · ${med}` : '');
}

function renderOC(s) {
  const el = document.getElementById('detOC');
  if (!ehCompras(s)) { el.innerHTML = ''; return; }
  const editar = podeSetarOC(s) && s.status !== 'cancelada';
  if (s.oc_ref) {
    el.innerHTML = `<div style="background:#efe7d6;border:1px solid var(--border);border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:11px;font-weight:700;color:#8a6d3b;text-transform:uppercase;letter-spacing:.4px">🧾 OC de compra</span>
      <b style="font-size:15px">${esc(s.oc_ref)}</b>
      ${editar ? `<button class="btn btn-ghost btn-sm" style="margin-left:auto" onclick="editarOC()">Editar</button>` : ''}
    </div>`;
  } else if (editar) {
    el.innerHTML = `<div style="background:#faf6ee;border:1px dashed var(--border);border-radius:8px;padding:10px 12px">
      <span class="field-label">🧾 Registrar OC de compra</span>
      <div style="display:flex;gap:8px;margin-top:4px">
        <input id="ocInput" placeholder="Nº da Ordem de Compra" style="flex:1" onkeydown="if(event.key==='Enter')salvarOC()">
        <button class="btn btn-primary btn-sm" onclick="salvarOC()">Registrar</button>
      </div></div>`;
  } else {
    el.innerHTML = `<div class="empty" style="padding:8px;text-align:left">🧾 Aguardando o comprador registrar a OC.</div>`;
  }
}
function editarOC() {
  const s = detAtual;
  document.getElementById('detOC').innerHTML = `<div style="display:flex;gap:8px;align-items:center">
    <input id="ocInput" value="${esc(s.oc_ref || '')}" style="flex:1" onkeydown="if(event.key==='Enter')salvarOC()">
    <button class="btn btn-primary btn-sm" onclick="salvarOC()">Salvar OC</button>
    <button class="btn btn-ghost btn-sm" onclick="renderOC(detAtual)">Cancelar</button></div>`;
  document.getElementById('ocInput').focus();
}
async function salvarOC() {
  const s = detAtual;
  const oc = document.getElementById('ocInput').value.trim();
  if (!oc) { alert('Informe o número da OC.'); return; }
  const primeira = !s.oc_ref;
  await sb.from('solicitacoes').update({ oc_ref: oc, updated_at: new Date().toISOString() }).eq('id', s.id);
  await sb.from('solicitacao_eventos').insert({ solicitacao_id: s.id, autor_id: sessao.id, tipo: 'comentario',
    texto: `🧾 OC de compra ${primeira ? 'registrada' : 'atualizada'}: ${oc}` });
  await notificar(s.criador_id, 'OC de compra registrada', `${s.titulo}: OC ${oc}`, s.id);
  await carregarSolicitacoes();
  abrirDetalhe(s.id);
}

/* ── MENÇÕES COM @ ──────────────────────────────────────────────────
   Escrever "@" num comentário abre a lista de quem existe no sistema. Ao
   escolher, o nome entra no texto e a pessoa recebe aviso no sininho e no
   celular.

   O nome completo entra no texto, com espaços, e é por isso que a detecção
   compara com a lista de usuários em vez de usar um regex de palavra: "Pablo
   Teixeira" não é uma palavra só, e um regex pararia no primeiro espaço.

   A lista flutuante nasce colada ao campo e é criada na hora, para não
   depender de nenhum HTML novo na página. */
var MENC_LISTA = null, MENC_CAMPO = null, MENC_OPCOES = [], MENC_SEL = 0;

function mencPessoas() { return usuarios || []; }

/* O "@parcial" que está sendo escrito agora, se houver. Só vale quando o @
   abre palavra: um e-mail no meio do texto não deve abrir a lista. */
function mencTrecho(campo) {
  const pos = campo.selectionStart;
  const antes = campo.value.slice(0, pos);
  const at = antes.lastIndexOf('@');
  if (at < 0) return null;
  if (at > 0 && !/\s/.test(antes[at - 1])) return null;
  const parcial = antes.slice(at + 1);
  if (parcial.includes('\n') || parcial.length > 24) return null;
  return { at, parcial };
}

function mencFechar() {
  window.removeEventListener('scroll', mencReposicionar, true);
  window.removeEventListener('resize', mencReposicionar);
  if (MENC_LISTA) { MENC_LISTA.remove(); MENC_LISTA = null; }
  MENC_CAMPO = null; MENC_OPCOES = []; MENC_SEL = 0;
}
function mencReposicionar() {
  if (!MENC_LISTA || !MENC_CAMPO) return;
  const r = MENC_CAMPO.getBoundingClientRect();
  if (!r.height) { mencFechar(); return; }     // campo saiu da tela
  MENC_LISTA.style.left = r.left + 'px';
  MENC_LISTA.style.width = Math.max(200, Math.min(r.width, 320)) + 'px';
  // abre para cima quando não cabe embaixo
  const abaixo = window.innerHeight - r.bottom;
  if (abaixo < 200 && r.top > 200) { MENC_LISTA.style.top = ''; MENC_LISTA.style.bottom = (window.innerHeight - r.top + 4) + 'px'; }
  else { MENC_LISTA.style.bottom = ''; MENC_LISTA.style.top = (r.bottom + 4) + 'px'; }
}


function mencDesenhar() {
  if (!MENC_LISTA) {
    MENC_LISTA = document.createElement('div');
    MENC_LISTA.style.cssText = 'position:fixed;z-index:9999;background:#fff;border:1px solid #ddd3c0;'
      + 'border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.14);max-height:190px;overflow-y:auto;'
      + 'min-width:200px;font-size:13px;font-family:inherit';
    document.body.appendChild(MENC_LISTA);
  }
  mencReposicionar();
  /* A modal do produto carrega observações, anexos e a linha do tempo depois
     de abrir, e cada uma empurra o campo para baixo. Medir uma vez só deixava
     a lista presa no layout de antes — ela aparecia fora da tela. Então
     remede no quadro seguinte e sempre que a página rolar. */
  requestAnimationFrame(mencReposicionar);
  window.addEventListener('scroll', mencReposicionar, true);
  window.addEventListener('resize', mencReposicionar);

  MENC_LISTA.innerHTML = MENC_OPCOES.map((u, i) => {
    const sel = i === MENC_SEL;
    return `<div data-i="${i}" style="padding:7px 11px;cursor:pointer;display:flex;gap:8px;align-items:baseline;`
      + `${sel ? 'background:#efe7d6;' : ''}">`
      + `<b style="font-weight:600">${mencEsc(u.nome)}</b>`
      + `<span style="font-size:11px;color:#8A8278">${mencEsc(u.setor || '')}</span></div>`;
  }).join('');
  [...MENC_LISTA.children].forEach(d => {
    d.onmousedown = (e) => { e.preventDefault(); mencEscolher(Number(d.dataset.i)); };
  });
}

function mencEsc(t) {
  return String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function mencEscolher(i) {
  const u = MENC_OPCOES[i];
  const campo = MENC_CAMPO;
  if (!u || !campo) return;
  const t = mencTrecho(campo);
  if (!t) { mencFechar(); return; }
  const depois = campo.value.slice(campo.selectionStart);
  campo.value = campo.value.slice(0, t.at) + '@' + u.nome + ' ' + depois;
  const novoPos = t.at + u.nome.length + 2;
  mencFechar();
  campo.focus();
  campo.setSelectionRange(novoPos, novoPos);
}

function mencAoDigitar(campo) {
  const t = mencTrecho(campo);
  if (!t) { mencFechar(); return; }
  const busca = t.parcial.toLowerCase();
  MENC_OPCOES = mencPessoas()
    .filter(u => !busca || u.nome.toLowerCase().includes(busca))
    .slice(0, 8);
  if (!MENC_OPCOES.length) { mencFechar(); return; }
  MENC_CAMPO = campo;
  MENC_SEL = 0;
  mencDesenhar();
}

function mencAoTeclar(ev) {
  if (!MENC_LISTA || !MENC_OPCOES.length) return false;
  if (ev.key === 'ArrowDown') { MENC_SEL = (MENC_SEL + 1) % MENC_OPCOES.length; mencDesenhar(); ev.preventDefault(); return true; }
  if (ev.key === 'ArrowUp')   { MENC_SEL = (MENC_SEL - 1 + MENC_OPCOES.length) % MENC_OPCOES.length; mencDesenhar(); ev.preventDefault(); return true; }
  if (ev.key === 'Enter' || ev.key === 'Tab') { mencEscolher(MENC_SEL); ev.preventDefault(); return true; }
  if (ev.key === 'Escape') { mencFechar(); ev.preventDefault(); return true; }
  return false;
}

function mencLigar(campo) {
  if (!campo || campo.dataset.mencOn) return;
  campo.dataset.mencOn = '1';
  campo.addEventListener('input', () => mencAoDigitar(campo));
  campo.addEventListener('keydown', (ev) => { mencAoTeclar(ev); }, true);
  campo.addEventListener('blur', () => setTimeout(mencFechar, 120));
}

/* Quem foi mencionado de verdade: compara com a lista, não com um padrão de
   texto. Assim "@Pablo Teixeira" encontra o Pablo e "@qualquer coisa" não
   encontra ninguém. */
function mencEncontradas(texto) {
  const t = String(texto || '');
  return mencPessoas().filter(u => t.includes('@' + u.nome));
}

/* Avisa cada mencionado. Nunca avisa quem escreveu: mencionar a si mesmo é
   quase sempre o cursor no lugar errado, não um pedido de atenção. */
async function mencAvisar(texto, titulo, corpo, ref) {
  const quem = mencEncontradas(texto).filter(u => u.id !== (sessao || {}).id);
  for (const u of quem) {
    try { await notificar(u.id, titulo, corpo, ref, 'solicitacao'); } catch (e) { console.error('aviso de menção:', e); }
  }
  return quem.map(u => u.nome);
}

/* Realce do nome no texto já escapado. Entra DEPOIS do escape, nunca antes:
   o texto vem do que as pessoas digitam e não pode virar HTML. */
function mencRealcar(textoEscapado) {
  let saida = String(textoEscapado || '');
  // nomes maiores primeiro, senão "Pablo" comeria o começo de "Pablo Teixeira"
  const nomes = mencPessoas().map(u => u.nome).sort((a, b) => b.length - a.length);
  nomes.forEach(n => {
    const alvo = '@' + mencEsc(n);
    saida = saida.split(alvo).join(
      '<span style="background:#efe7d6;color:#8a6d3b;border-radius:3px;padding:0 3px;font-weight:600">'
      + alvo + '</span>');
  });
  return saida;
}

async function registrarEvento(tipo) {
  const texto = document.getElementById('acTexto').value.trim();
  if (!texto) { alert('Escreva algo antes.'); return; }
  const s = detAtual;
  await sb.from('solicitacao_eventos').insert({ solicitacao_id:s.id, autor_id:sessao.id, tipo, texto });
  await mencAvisar(texto, `${nomeDe(sessao.id)} mencionou você`,
                   `${s.produto_ref || s.titulo}: ${texto.slice(0, 90)}`, s.id);
  const novoStatus = s.status === 'aberta' ? 'em_andamento' : s.status;
  await sb.from('solicitacoes').update({ status:novoStatus, updated_at:new Date().toISOString() }).eq('id', s.id);
  // avisa o criador que a solicitação dele andou
  await notificar(s.criador_id, 'Sua solicitação teve movimento', `${s.titulo}: ${texto.slice(0,80)}`, s.id);
  await avisarAdmins(`${nomeDe(sessao.id)} registrou em uma solicitação`,
    `${s.titulo}: ${texto.slice(0,80)}`, s.id, [s.criador_id]);
  await carregarSolicitacoes();
  abrirDetalhe(s.id);
}

/* ── MEDIDAS QUE NÃO CONFEREM ───────────────────────────────────────
   Marcar "não" quer dizer que a peça saiu diferente do que está cadastrado, e
   isso deixa de ser assunto da documentação: quem acerta o produto no Seven é
   o Cadastro. Para acertar, ele precisa das duas colunas lado a lado — o que
   está cadastrado hoje e o que a fita mediu na peça.
   Sai na CONCLUSÃO e não no clique do "não": até concluir, ele ainda pode
   estar medindo e mudar de ideia. */
async function encaminharMedidasDivergentes(pai) {
  if (!ehConferencia(pai) || !detConf || detConf.medicoes_ok !== false) return;
  try {
    const { data: cfg } = await sb.from('configuracoes').select('valor')
      .eq('chave', 'responsavel_cadastro').maybeSingle();
    const nomeResp = cfg && cfg.valor;
    if (!nomeResp) {
      alert('As medidas divergem, mas não há ninguém configurado como responsável do Cadastro.\nConfigure em Admin → Configurações e encaminhe à mão.');
      return;
    }
    const { data: resp } = await sb.from('usuarios').select('id,nome')
      .eq('nome', nomeResp).eq('ativo', true).maybeSingle();
    if (!resp) {
      alert(`As medidas divergem, mas ${nomeResp} não está ativo no sistema.\nEncaminhe à mão para quem for cuidar do cadastro.`);
      return;
    }

    let prod = null;
    if (detConf.produto_id) {
      const r = await sb.from('produtos')
        .select('n_pedido,produto,tipo,cod_cadastro,responsavel,pes,qtd_tecido,data_entrega')
        .eq('id', detConf.produto_id).maybeSingle();
      prod = r.data;
    }
    const linha = (rot, val) => `${rot}: ${val || '—'}`;
    const sn = v => v == null ? 'não respondido' : (v ? 'sim' : 'não');
    const corpo = [
      'As medidas da peça física NÃO conferem com o que está cadastrado.',
      '',
      'COMO ESTÁ CADASTRADO',
      linha('Nº pedido', pai.pedido_ref),
      linha('Produto', pai.produto_ref),
      linha('Tipo', prod && prod.tipo),
      linha('Cód. cadastro', prod && prod.cod_cadastro),
      linha('Responsável', prod && prod.responsavel),
      linha('Pés do produto', prod && prod.pes),
      linha('Quantidade de tecido', prod && prod.qtd_tecido),
      linha('Data de entrega', prod && prod.data_entrega),
      '',
      'O QUE FOI MEDIDO NA PEÇA (em metros)',
      ...CONF_MEDIDAS.map(([k, rot]) => linha(rot, detConf[k])),
      '',
      'RESTO DA CONFERÊNCIA',
      linha('Bloco 3D', sn(detConf.bloco_3d)),
      linha('Ficha técnica', sn(detConf.ficha_tecnica)),
      '',
      'OBSERVAÇÃO DE QUEM CONFERIU',
      detConf.observacao || '—',
      '',
      `Conferido por ${nomeDe(sessao.id)} em ${new Date().toLocaleString('pt-BR')}.`
    ].join('\n');

    const titulo = `Medidas divergentes — corrigir cadastro — ${pai.produto_ref || pai.titulo}`;
    const { data: filha, error } = await sb.from('solicitacoes').insert({
      titulo, descricao: corpo,
      criador_id: sessao.id, responsavel_id: resp.id, prioridade: pai.prioridade,
      pedido_ref: pai.pedido_ref, produto_ref: pai.produto_ref,
      origem_solicitacao_id: pai.id     // fica ligada à conferência que a gerou
    }).select().single();
    if (error) throw error;

    await sb.from('solicitacao_eventos').insert({
      solicitacao_id: pai.id, autor_id: sessao.id, tipo: 'encaminhamento',
      texto: `Medidas divergentes: encaminhado para ${resp.nome} corrigir o cadastro.`,
      solicitacao_filha_id: filha.id
    });
    await notificar(resp.id, 'Medidas divergentes', titulo, filha.id);
  } catch (e) {
    console.error('encaminhamento de medidas divergentes:', e);
    // a conferência já foi concluída; não dá para fingir que o resto saiu
    alert('A conferência foi concluída, mas não consegui abrir a solicitação para o Cadastro:\n'
      + e.message + '\n\nEncaminhe à mão para não perder a correção.');
  }
}

/* Avisa quem acompanha o Dev que o PCP liberou o produto. A lista é a mesma
   do aviso de produto novo, em Admin → Configurações. */
/* Os administradores acompanham o que acontece nas solicitações: abertura,
   movimento e conclusão. A ticagem de etapa, que é o volume alto, não passa
   por aqui — ela vive no checklist e vai só para quem está na configuração. */
async function avisarAdmins(titulo, corpo, ref, excluir) {
  try {
    const { data } = await sb.from('usuarios').select('id,nome').eq('admin', true).eq('ativo', true);
    const fora = new Set([sessao.id, ...(excluir || [])]);
    for (const u of (data || [])) {
      if (fora.has(u.id)) continue;      // quem fez, e quem já foi avisado por outro caminho
      await notificar(u.id, titulo, corpo, ref, 'solicitacao');
    }
  } catch (e) { console.error('aviso aos admins:', e); }
}

async function avisarDevLiberacaoPcp(s) {
  try {
    const { data: cfg } = await sb.from('configuracoes')
      .select('valor').eq('chave', 'usuarios_avisos_dev').maybeSingle();
    const nomes = String((cfg && cfg.valor) || '').split(',').map(x => x.trim()).filter(Boolean);
    if (!nomes.length) return;
    const { data: gente } = await sb.from('usuarios')
      .select('id,nome').in('nome', nomes).eq('ativo', true);
    for (const u of (gente || [])) {
      await notificar(u.id, '🏭 PCP liberou',
        `${s.produto_ref || s.titulo}${s.pedido_ref ? ' · pedido ' + s.pedido_ref : ''}`, s.id, 'checklist');
    }
  } catch (e) { console.error('aviso de liberação do PCP:', e); }
}

async function concluir() {
  const s = detAtual;
  const vaiAbrirCadastro = ehConferencia(s) && detConf && detConf.medicoes_ok === false;
  const pergunta = vaiAbrirCadastro
    ? 'Concluir esta conferência?\n\nComo as medidas NÃO conferem, será aberta uma solicitação para o Cadastro com os dados do produto e o que você mediu.'
    : 'Concluir esta solicitação?';
  if (!confirm(pergunta)) return;
  await sb.from('solicitacoes').update({
    status:'concluida', concluida_em:new Date().toISOString(), updated_at:new Date().toISOString()
  }).eq('id', s.id);
  await sb.from('solicitacao_eventos').insert({
    solicitacao_id:s.id, autor_id:sessao.id, tipo:'status', texto:'Solicitação concluída'
  });
  await notificar(s.criador_id, 'Solicitação concluída', s.titulo, s.id);
  await avisarAdmins('✓ Solicitação concluída',
    `${s.titulo} — por ${nomeDe(sessao.id)}`, s.id, [s.criador_id]);
  /* O PCP concluir a liberação é o que destrava o produto para o Dev começar.
     Antes só quem abriu a solicitação sabia — normalmente o comercial — e o
     Dev descobria por acaso, olhando a lista. */
  if ((s.titulo || '').startsWith('Liberado para inclusão em lote')) {
    await avisarDevLiberacaoPcp(s);
  }
  // medida que não confere vira trabalho para o Cadastro, não fica no aviso
  await encaminharMedidasDivergentes(s);
  fecharOverlay('detOverlay');
  await carregarSolicitacoes();
}

/* ── ENCAMINHAR (gera solicitação filha) ────────────── */
function abrirEncaminhar() {
  document.getElementById('encTitulo').value = '';
  document.getElementById('encTexto').value = '';
  abrirOverlay('encOverlay');
}

async function confirmarEncaminhar() {
  const btn = document.getElementById('btnEnc');
  const paraId = document.getElementById('encPara').value;
  const titulo = document.getElementById('encTitulo').value.trim();
  const texto  = document.getElementById('encTexto').value.trim();
  if (!titulo) { alert('Informe o título da nova solicitação.'); return; }
  btn.disabled = true;
  try {
    const pai = detAtual;
    // 1) cria a solicitação filha, herdando o vínculo com o produto
    const { data: filha, error } = await sb.from('solicitacoes').insert({
      titulo,
      descricao: texto || null,
      criador_id: sessao.id,
      responsavel_id: paraId,
      prioridade: pai.prioridade,
      pedido_ref: pai.pedido_ref,
      produto_ref: pai.produto_ref,
      origem_solicitacao_id: pai.id
    }).select().single();
    if (error) throw error;
    // 2) registra o encaminhamento na timeline da solicitação de origem
    await sb.from('solicitacao_eventos').insert({
      solicitacao_id: pai.id, autor_id: sessao.id, tipo:'encaminhamento',
      texto: `Encaminhado para ${nomeDe(paraId)}: ${titulo}${texto ? ' — ' + texto : ''}`,
      solicitacao_filha_id: filha.id
    });
    await sb.from('solicitacoes').update({
      status: pai.status === 'aberta' ? 'em_andamento' : pai.status,
      updated_at: new Date().toISOString()
    }).eq('id', pai.id);
    await notificar(paraId, 'Solicitação encaminhada para você', titulo, filha.id);
    fecharOverlay('encOverlay');
    await carregarSolicitacoes();
    abrirDetalhe(pai.id);
  } catch (e) { alert('Erro: ' + e.message); }
  finally { btn.disabled = false; }
}

/* ── NOTIFICAÇÕES ───────────────────────────────────── */
async function notificar(paraId, titulo, corpo, ref, origem = 'solicitacao') {
  if (!paraId || paraId === sessao.id) return;   // não notifica a si mesmo
  try {
    const { data, error } = await sb.from('notificacoes')
      .insert({ para_usuario_id:paraId, titulo, corpo, origem, ref }).select().single();
    if (error) throw error;
    dispararPush(data);
  } catch (e) { console.error('Falha ao notificar:', e); }
}

// Dispara o aviso no computador da pessoa. Nunca bloqueia nem quebra o fluxo:
// se o push falhar, a notificação continua valendo dentro do sistema (sininho).
function dispararPush(registro) {
  if (!registro) return;
  sb.functions.invoke(PUSH_FN, { body: { record: registro } })
    .catch(e => console.error('Falha ao enviar push:', e));
}

// Alerta de solicitação parada há +X dias (uma notificação por parada)
async function verificarAtrasadas() {
  const minhas = solicitacoes.filter(s =>
    s.responsavel_id === sessao.id &&
    (s.status === 'aberta' || s.status === 'em_andamento') &&
    diasParados(s) >= diasAlerta
  );
  if (!minhas.length) return;
  /* A ordem importa: `find` devolve o PRIMEIRO que casa, e sem ordenar isso
     era o aviso mais ANTIGO. Comparar o mais antigo com `updated_at` dava
     quase sempre "ainda não avisei", e o alerta saía de novo a cada vez que
     alguém abria a tela — uma única solicitação gerou 106 avisos em 9 dias.
     Decrescente, o primeiro que casa é o último aviso, que é o que interessa. */
  const { data: jaAvisadas } = await sb.from('notificacoes')
    .select('ref, created_at').eq('para_usuario_id', sessao.id).eq('origem','solicitacao_atraso')
    .order('created_at', { ascending: false });
  for (const s of minhas) {
    const ultimo = (jaAvisadas || []).find(n => n.ref === s.id);
    if (ultimo) {
      // já avisei depois da última movimentação: não há nada de novo a dizer
      if (new Date(ultimo.created_at) > new Date(s.updated_at)) continue;
      // rede de segurança: no máximo um aviso por dia sobre a mesma solicitação,
      // aconteça o que acontecer com as datas
      if (Date.now() - new Date(ultimo.created_at).getTime() < 86400000) continue;
    }
    const { data: nova } = await sb.from('notificacoes').insert({
      para_usuario_id: sessao.id,
      titulo: `Solicitação parada há ${diasParados(s)} dias`,
      corpo: s.titulo, origem: 'solicitacao_atraso', ref: s.id
    }).select().single();
    dispararPush(nova);
  }
  atualizarBell();
}

// "Ding" curto gerado no navegador (sem arquivo externo)
function tocarDing() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const nota = (freq, inicio, dur) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime + inicio);
      g.gain.exponentialRampToValueAtTime(0.22, ac.currentTime + inicio + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + inicio + dur);
      o.start(ac.currentTime + inicio); o.stop(ac.currentTime + inicio + dur);
    };
    nota(880, 0, 0.16); nota(1175, 0.11, 0.22);
    setTimeout(() => ac.close(), 700);
  } catch (e) {}
}

let _unreadAnterior = null;
async function atualizarBell() {
  const { count } = await sb.from('notificacoes')
    .select('id', { count:'exact', head:true }).eq('para_usuario_id', sessao.id).eq('lida', false);
  const c = count || 0;
  const b = document.getElementById('bellBadge');
  if (c > 0) { b.textContent = c; b.classList.remove('hidden'); } else b.classList.add('hidden');
  if (_unreadAnterior !== null && c > _unreadAnterior) tocarDing();
  _unreadAnterior = c;
}

async function abrirNotificacoes() {
  abrirOverlay('notifOverlay');
  const el = document.getElementById('notifList');
  el.innerHTML = '<div class="empty">Carregando...</div>';
  const { data } = await sb.from('notificacoes').select('*')
    .eq('para_usuario_id', sessao.id).order('created_at', { ascending:false }).limit(50);
  if (!data || !data.length) { el.innerHTML = '<div class="empty">Nenhuma notificação.</div>'; return; }
  el.innerHTML = data.map(n => `<div class="notif-item ${n.lida?'':'unread'}">
      <div style="font-weight:600">${n.titulo}</div>
      ${n.corpo ? `<div class="m">${n.corpo}</div>` : ''}
      <div class="m">${n.origem||''} · ${new Date(n.created_at).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
    </div>`).join('');
  const naoLidas = data.filter(n => !n.lida).map(n => n.id);
  if (naoLidas.length) { await sb.from('notificacoes').update({ lida:true }).in('id', naoLidas); atualizarBell(); }
}

/* ── UTIL ───────────────────────────────────────────── */
function abrirOverlay(id) { document.getElementById(id).style.display = 'flex'; }
function fecharOverlay(id) { document.getElementById(id).style.display = 'none'; }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const abertas = [...document.querySelectorAll('.overlay')].filter(o => o.style.display === 'flex');
    if (abertas.length) abertas[abertas.length-1].style.display = 'none';
  }
});

/* ── TEMPO REAL (Supabase Realtime) ─────────────────── */
function assinarTempoReal() {
  if (!sb) return;
  let t = null;
  const refrescar = () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      await carregarSolicitacoes();                 // atualiza a lista + contagens
      const detOpen = document.getElementById('detOverlay').style.display === 'flex';
      const digitando = ['INPUT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
      if (detOpen && detAtual && !digitando) abrirDetalhe(detAtual.id);  // não interrompe quem digita
    }, 250);
  };
  sb.channel('solic-rt')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitacoes' }, refrescar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'solicitacao_eventos' }, refrescar)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notificacoes' }, () => atualizarBell())
    .subscribe();
}

/* ── INIT ───────────────────────────────────────────── */
(async function init() {
  if (!carregarSessao()) return;
  await Promise.all([carregarUsuarios(), carregarConfig()]);
  await carregarSolicitacoes();
  atualizarBell();
  setInterval(atualizarBell, 30000);
  assinarTempoReal();

  // abre direto uma solicitação específica quando vier de um link (?sol=<id>)
  const solId = new URLSearchParams(location.search).get('sol');
  if (solId) {
    /* Link de notificação ou de menção pode apontar para uma solicitação que
       não está na lista de quem abriu — menção alcança qualquer pessoa, não só
       o responsável. Busca aquela, e só aquela, para o link não morrer na mão
       de quem foi chamado de propósito. */
    if (!solicitacoes.some(x => x.id === solId)) {
      const { data: avulsa } = await sb.from('solicitacoes').select('*').eq('id', solId).maybeSingle();
      if (avulsa) { avulsa._eventos = 0; avulsa._anexos = 0; solicitacoes.push(avulsa); }
    }
    if (solicitacoes.some(x => x.id === solId)) {
      const t = document.getElementById('tab-todas');
      if (t) setFiltro('todas', t);
      abrirDetalhe(solId);
    }
  }
})();
</script>
